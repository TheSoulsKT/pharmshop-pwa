<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta id="tc" name="theme-color" content="#121214"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PharmShop</title>
<style>
:root{--bg:#121214;--card:#1D1C21;--line:#2B2A31;--text:#F2F2F4;--mute:#9A9DA3;--blue:#3B8EF3;--on:#000;--green:#34C759;--red:#FF5A5F;--k:1;--ts:1}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:calc(15px*var(--ts))/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:12px 14px 0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mute);padding:4px 0;font:inherit;font-size:10px}
nav button.on{color:var(--blue);font-weight:700}
.wr{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.wr button.chip{margin:0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}.dot.on{border-color:var(--text)}
button.b.dg{color:#fff}
h2{margin:0 0 10px;font-size:20px}.mute{color:var(--mute)}.small{font-size:12px}.err{color:var(--red);min-height:18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:12px 14px;margin-bottom:12px}
input,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(14px*var(--k));padding:11px 14px;font:inherit}
button.b{background:var(--blue);color:var(--on);border:0;border-radius:calc(14px*var(--k));padding:11px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px}
button.chip{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(18px*var(--k));padding:7px 14px;font:inherit;margin-right:6px}
button.chip.on{border-color:var(--blue);color:var(--blue)}
#list{flex:1;overflow-y:auto;padding:4px 0 8px}
.m{max-width:82%;margin:6px 0;padding:7px 11px;border-radius:calc(16px*var(--k));background:var(--card);border:1px solid var(--line);word-wrap:break-word;white-space:pre-wrap}
.m.me{margin-left:auto;background:var(--blue);color:var(--on);border-color:transparent}
.m .n{font-size:12px;font-weight:700;display:block}.m .t{font-size:10px;opacity:.65;display:block;text-align:right}
.crown{width:14px;height:14px;vertical-align:-2px;margin-left:4px}
.row{display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px}.row textarea{flex:1;resize:none;max-height:100px}
#send{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:var(--on);font-size:18px;font-weight:700;flex:none}
#send.cd{background:var(--card);color:var(--text);border:1px solid var(--line)}
.dm{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
.vp{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;border-radius:calc(12px*var(--k));padding:11px 0;color:var(--text);font:inherit;font-weight:600}
.seg button.on{background:var(--blue);color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gb{background:none;border:1px solid var(--line);border-radius:calc(12px*var(--k));color:var(--text);padding:12px 8px;font:inherit;font-size:14px;min-height:46px}
.gb.pr{background:var(--blue);border-color:var(--blue);color:var(--on);font-weight:600}
.lnk{font-size:12px;color:var(--mute);word-break:break-all;-webkit-user-select:all;user-select:all;margin-bottom:8px}
select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(14px*var(--k));padding:12px 14px;font:inherit;margin:4px 0 10px}
.paybar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:12px 14px;margin-top:6px}
.lk{color:var(--blue);padding:8px 0;font-size:14px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:50}
.sh{width:100%;max-height:80%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh .it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:14px 4px;font:inherit}
button.b.ghost{background:none;color:var(--mute)}button.b.dg{background:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:calc(14px*var(--k));z-index:60;max-width:88%;font-size:14px;text-align:center}
</style></head><body>
<div id="view"></div>
<nav><button data-t="vpn"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.84) translate(-12 -12)"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M20 12v2.5"/></g></svg><span>VPN</span></button><button data-t="chat"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.84) translate(-12 -12)"><circle cx="8" cy="8" r="3.4"/><path d="M1 21.5A7 7 0 0 1 15 21.5"/><circle cx="17" cy="8.5" r="2.7"/><path d="M13 18.5A4 4 0 0 1 21 18.5"/></g></svg><span>Чат</span></button><button data-t="help"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.84) translate(-12 -12)"><path d="M5 4.5H19Q21 4.5 21 6.5V14.5Q21 16.5 19 16.5H11L6.5 20.5V16.5H5Q3 16.5 3 14.5V6.5Q3 4.5 5 4.5Z"/></g></svg><span>Поддержка</span></button><button data-t="me"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.84) translate(-12 -12)"><circle cx="12" cy="8" r="4"/><path d="M4 23A8 8 0 0 1 20 23"/></g></svg><span>Профиль</span></button></nav>
<script>
const API='https://flat-violet-e617pharmshop-chat.soulszlord.workers.dev';
const SITEKEY='3d88c4d4-c8f4-4e0a-8db6-21e62e840604';
const COOLDOWN=10000;
const $=(s,r=document)=>r.querySelector(s);
const esc=(t)=>String(t).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d=''){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let device=LS.get('device'),secret=LS.get('secret');
if(!device){device=crypto.randomUUID();secret=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');LS.set('device',device);LS.set('secret',secret)}

// ---------- Оформление (как в Android: Настройки → Оформление) ----------
const SKINS=[[0,'💊','Стандарт',['#121214','#1D1C21','#2B2A31','#3B8EF3'],['#F4F4F7','#FFFFFF','#E1E1E8','#3B8EF3']],[1,'🍂','Осень',['#17120E','#231A13','#3A2B1F','#FF9A3D'],['#FBF3EA','#FFFFFF','#EBD9C6','#F28A2E']],[2,'🎄','Новый год',['#0E1613','#16231D','#27392F','#FF5A5F'],['#F1F8F3','#FFFFFF','#D3E5D9','#EF4B52']],[3,'☀️','Лето',['#0C1A1E','#132A30','#1F4048','#FFC233'],['#FFF8E6','#FFFFFF','#F5E3B3','#FFB300']],[4,'🌸','Весна',['#1A1218','#271A24','#3E2A39','#F472B6'],['#FFF4F8','#FFFFFF','#F4D3E2','#F06AA8']],[5,'🚀','Космос',['#06071A','#0F1130','#222550','#8B7CFF'],['#EEF0FF','#FFFFFF','#D6D9F5','#7C6CF5']],[6,'🎤','Rap',['#0A0A0A','#161616','#2C2C2C','#D4FF00'],['#F0F0F0','#FFFFFF','#DADADA','#FF2E93']]];
const ACCS=[[1,'Синий','#3B8EF3','#2F7DE0'],[2,'Бирюзовый','#22C1DC','#0C93AB'],[3,'Зелёный','#34C759','#1E9E45'],[4,'Жёлтый','#FFC233','#E0A000'],[5,'Оранжевый','#FF9A3D','#E0700C'],[6,'Красный','#FF5A5F','#E0352C'],[7,'Розовый','#F472B6','#E0489A'],[8,'Фиолетовый','#8B7CFF','#7C6CF5']];
const TH=(k,d)=>Number(LS.get('th_'+k,String(d)));
function applyTheme(){
  const m=TH('mode',1),light=m===2||(m===0&&matchMedia('(prefers-color-scheme:light)').matches);
  const sk=SKINS.find(s=>s[0]===TH('skin',0))||SKINS[0],p=light?sk[4]:sk[3],a=ACCS.find(x=>x[0]===TH('acc',0));
  const r=document.documentElement.style,set=(k,v)=>r.setProperty(k,v);
  set('--bg',p[0]);set('--card',p[1]);set('--line',p[2]);set('--blue',a?(light?a[3]:a[2]):p[3]);
  set('--text',light?'#17171A':'#F2F2F4');set('--mute',light?'#6B6F76':'#9A9DA3');
  set('--green',light?'#1E9E45':'#34C759');set('--red',light?'#E0352C':'#FF5A5F');
  set('--ts',[0.9,1,1.15][TH('ts',1)]);set('--k',[0.5,1,1.5][TH('cs',1)]);
  const tc=document.getElementById('tc');if(tc)tc.content=p[0];
}
applyTheme();matchMedia('(prefers-color-scheme:light)').addEventListener&&matchMedia('(prefers-color-scheme:light)').addEventListener('change',applyTheme);
function thmRender(){
  const ch=(k,v,t)=>`<button class="chip${TH(k,k==='mode'?1:k==='skin'||k==='acc'?0:1)===v?' on':''}" data-k="${k}" data-v="${v}">${t}</button>`;
  const box=$('#thm');if(!box)return;
  box.innerHTML=`<div class="card"><b>Оформление</b>
  <div class="mute small" style="margin:10px 0 0">Тема</div><div class="wr">${[[1,'Тёмная'],[2,'Светлая'],[0,'Как в системе']].map(x=>ch('mode',x[0],x[1])).join('')}</div>
  <div class="mute small">Оформление</div><div class="wr">${SKINS.map(s=>ch('skin',s[0],s[1]+' '+s[2])).join('')}</div>
  <div class="mute small">Цвет акцента</div><div class="wr">${ch('acc',0,'Как в теме')}${ACCS.map(a=>`<button class="dot${TH('acc',0)===a[0]?' on':''}" style="background:${a[2]}" title="${a[1]}" data-k="acc" data-v="${a[0]}"></button>`).join('')}</div>
  <div class="mute small">Размер текста</div><div class="wr">${[[0,'Мелкий'],[1,'Обычный'],[2,'Крупный']].map(x=>ch('ts',x[0],x[1])).join('')}</div>
  <div class="mute small">Скругление карточек</div><div class="wr">${[[0,'Малое'],[1,'Обычное'],[2,'Большое']].map(x=>ch('cs',x[0],x[1])).join('')}</div></div>`;
  box.onclick=(e)=>{const b=e.target.closest('[data-k]');if(!b)return;LS.set('th_'+b.dataset.k,b.dataset.v);applyTheme();thmRender()};
}
const meTab0=meTab;
meTab=async function(){await meTab0();if(tab!=='me')return;const d=document.createElement('div');d.id='thm';view.appendChild(d);thmRender()};
async function api(path,extra={}){
  const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({device,secret,...extra})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||('Ошибка '+r.status));e.retry=j.retry_ms||0;throw e}
  return j;
}
const CROWN='<svg class="crown" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18L3 7l5.5 5L12 5l3.5 7L21 7l-.5 11z"/><path d="M4 21h16"/></svg>';
const nameHtml=(m)=>`<span class="n">${esc(m.nick)}${m.crown?CROWN:''}${m.badge?' <span style="color:var(--blue)">✓</span>':''}</span>`;
const clock=(ts)=>new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
let tab=LS.get('tab','chat'),sub=0,timer=null,me=null,nextAt=Number(LS.get('nextAt','0'));
const view=$('#view');
function stop(){clearTimeout(timer);timer=null;gen++}
let gen=0;
function go(t){tab=t;LS.set('tab',t);stop();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({chat:chatTab,help:helpTab,vpn:vpnScreen,me:meTab})[t]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

// ---------- общая лента ----------
function pane({fetchFn,sendFn,mine,showNames,cool,empty}){
  const g=gen;let last=0,rev=-1,lastDay='';
  view.insertAdjacentHTML('beforeend',`<div id="list"><div class="mute">${empty}</div></div><div class="err" id="e"></div><div class="row"><textarea id="f" rows="1" placeholder="Сообщение" maxlength="1000"></textarea><button id="send">➤</button></div>`);
  const list=$('#list'),f=$('#f'),send=$('#send'),e=$('#e');
  function add(m){
    if(m.id<=last)return;last=m.id;if(last&&list.firstChild&&list.firstChild.classList.contains('mute'))list.innerHTML='';
    const own=mine(m);
    list.insertAdjacentHTML('beforeend',`<div class="m ${own?'me':''}" data-id="${m.id}">${showNames&&!own?nameHtml(m):''}${esc(m.text)}<span class="t">${clock(m.ts)}</span></div>`);
  }
  async function poll(){
    if(g!==gen)return;
    try{
      const r=await fetchFn(last,rev);
      if(g!==gen)return;
      if(r.reset){list.innerHTML='<div class="mute">'+empty+'</div>';last=0}
      rev=r.rev??rev;
      const atEnd=list.scrollHeight-list.scrollTop-list.clientHeight<80,before=last;
      (r.messages||[]).forEach(add);
      if(r.me)me=r.me;
      if(last!==before&&(atEnd||before===0))list.scrollTop=list.scrollHeight;
      e.textContent='';
    }catch(x){e.textContent=x.message}
    timer=setTimeout(poll,4000);
  }
  function tick(){
    if(g!==gen)return;const left=nextAt-Date.now();
    if(left>0&&cool()){send.className='cd';send.textContent=Math.ceil(left/1000);setTimeout(tick,250)}else{send.className='';send.textContent='➤'}
  }
  async function doSend(){
    const left=nextAt-Date.now();
    if(left>0&&cool()){e.textContent='Следующее сообщение через '+Math.ceil(left/1000)+' с';return}
    const text=f.value.trim();if(!text)return;f.value='';
    if(cool()){nextAt=Date.now()+COOLDOWN;LS.set('nextAt',nextAt);tick()}
    try{await sendFn(text);clearTimeout(timer);poll()}
    catch(x){f.value=text;e.textContent=x.message;if(x.retry){nextAt=Date.now()+x.retry;LS.set('nextAt',nextAt)}else if(cool()){nextAt=0}tick()}
  }
  send.onclick=doSend;f.onkeydown=(k)=>{if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();doSend()}};
  tick();poll();
}

// ---------- чат ----------
async function chatTab(){
  view.innerHTML='<div class="mute">Загрузка…</div>';const g=gen;
  try{me=await api('/api/chat/me')}catch(x){view.innerHTML=`<div class="err">${esc(x.message)}</div><button class="b" onclick="go('chat')">Повторить</button>`;return}
  if(g!==gen)return;
  if(!me.registered)return register();
  view.innerHTML=`<div style="margin-bottom:10px"><button class="chip ${sub?'':'on'}" id="t0">Общий чат</button><button class="chip ${sub?'on':''}" id="t1">Личные</button></div>`;
  $('#t0').onclick=()=>{sub=0;go('chat')};$('#t1').onclick=()=>{sub=1;go('chat')};
  if(!sub)pane({empty:'Здесь пока тихо. Напишите первым!',showNames:true,mine:(m)=>m.uid===me.uid,cool:()=>!(me&&me.badge),
    fetchFn:(a,r)=>api('/api/room/messages',{after:a,rev:r}),sendFn:(t)=>api('/api/room/send',{text:t})});
  else dmList();
}
function register(){
  view.innerHTML=`<div class="card"><b>🤝 Чат создан, чтобы помогать друг другу</b><div class="mute small">Задавайте вопросы, делитесь опытом и подсказывайте другим. Будьте вежливы: за спам и оскорбления доступ могут закрыть.</div></div>
  <h2>Выберите ник</h2><div class="mute small" style="margin-bottom:10px">3–20 символов: латиница или кириллица (не вперемешку), цифры и «_». Ник можно менять раз в 7 дней. Перед входом нужно пройти проверку «я не робот».</div>
  <input id="nick" maxlength="21" autocomplete="off" placeholder="Ник"><div class="err" id="e"></div><div id="cap"></div><button class="b" id="go">Занять ник</button>`;
  const e=$('#e');let busy=false,wid=null;
  $('#go').onclick=async()=>{
    if(busy)return;const nick=$('#nick').value.trim().replace(/^@/,'');if(!nick)return;busy=true;e.textContent='Проверяем ник…';
    try{await api('/api/chat/register',{nick,check:true})}catch(x){e.textContent=x.message;busy=false;return}
    if(!window.hcaptcha){e.textContent='Капча не загрузилась. Проверьте интернет и обновите страницу';busy=false;return}
    e.textContent='Пройдите проверку…';$('#cap').innerHTML='';
    wid=hcaptcha.render('#cap',{sitekey:SITEKEY,theme:'dark',callback:async(token)=>{
      e.textContent='Входим в чат…';
      try{await api('/api/chat/register',{nick,captcha:token});LS.set('nick',nick);go('chat')}
      catch(x){e.textContent=x.message;busy=false;try{hcaptcha.reset(wid)}catch(_){}}},
      'error-callback':()=>{e.textContent='Проверка не пройдена. Попробуйте ещё раз';busy=false},
      'close-callback':()=>{busy=false}});
  };
}
async function dmList(){
  const g=gen;
  view.insertAdjacentHTML('beforeend','<button class="chip" id="find" style="margin-bottom:8px;align-self:flex-start">✉ Написать по нику</button><div id="dl" style="overflow-y:auto;flex:1"></div>');
  $('#find').onclick=async()=>{const n=prompt('Ник собеседника');if(!n)return;try{const r=await api('/api/dm/find',{nick:n});dmOpen(r.uid,r.nick)}catch(x){alert(x.message)}};
  async function load(){
    if(g!==gen)return;
    try{const r=await api('/api/dm/list');if(g!==gen)return;
      $('#dl').innerHTML=r.chats.length?r.chats.map(c=>`<div class="dm" data-u="${c.uid}" data-n="${esc(c.nick)}"><div><b>${esc(c.nick)}${c.crown?CROWN:''}</b><div class="mute small">${c.sender===me.uid?'Вы: ':''}${esc(c.text).slice(0,80)}</div></div>${c.unread?`<b style="color:var(--blue)">${c.unread}</b>`:''}</div>`).join(''):'<div class="mute">Личных чатов пока нет. Найдите человека по нику.</div>';
      document.querySelectorAll('.dm').forEach(d=>d.onclick=()=>dmOpen(Number(d.dataset.u),d.dataset.n));
    }catch(x){}
    timer=setTimeout(load,6000);
  }
  load();
}
function dmOpen(uid,nick){
  stop();view.innerHTML=`<div style="margin-bottom:8px"><button class="chip" id="back">← Назад</button><b>${esc(nick)}</b></div>`;
  $('#back').onclick=()=>{sub=1;go('chat')};
  pane({empty:'Переписки пока нет. Напишите первым.',showNames:false,mine:(m)=>m.uid===me.uid,cool:()=>false,
    fetchFn:(a)=>api('/api/dm/messages',{with:uid,after:a}),sendFn:(t)=>api('/api/dm/send',{to:uid,text:t})});
}

// ---------- поддержка ----------
function helpTab(){
  view.innerHTML='<h2>Поддержка</h2><div class="mute small" style="margin-bottom:6px">Опишите проблему — ответ придёт сюда.</div>';
  pane({empty:'Напишите, чем помочь.',showNames:false,mine:(m)=>m.from==='user',cool:()=>false,
    fetchFn:async(a)=>{const r=await api('/api/chat/messages',{after:a});return r},
    sendFn:(t)=>api('/api/chat/send',{nick:LS.get('nick'),order:'',version:'pwa',text:t,info:navigator.userAgent.slice(0,200)})});
}

// ---------- профиль ----------
async function meTab(){
  view.innerHTML='<h2>Профиль</h2><div class="mute">Загрузка…</div>';const g=gen;
  try{me=await api('/api/chat/me')}catch(x){view.innerHTML=`<div class="err">${esc(x.message)}</div>`;return}
  if(g!==gen)return;

// ---------- VPN (личный кабинет pvpn.vitrinka.net, как в приложении для Android) ----------
// Запросы идут через воркер (/api/vpn/call): он подставляет cookie входа и отдаёт новый. Суммы сервер присылает в копейках.
const VPN_AUTH='/api/client/web';
class VpnAuth extends Error{}
class VpnFail extends Error{constructor(m,captcha){super(m);this.captcha=!!captcha}}
let vTok='',vExp=0,vBusy=false,vsid=0,vPollGen=0,vRefreshing=null,cfgP=null;
const vRef=()=>LS.get('vpn_refresh');
const vOk=(r)=>r.code>=200&&r.code<300;

async function vraw(m,p,b,o={}){
  const r=await fetch(API+'/api/vpn/call',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({device,m,p,b:b==null?null:String(b),bearer:o.bearer||'',refresh:o.refresh||'',ref:o.ref||'/app/plans'})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('Ошибка '+r.status));
  return j; // {code,text,refresh}
}
function vErr(r){
  const t=(r.text||'').trim();
  if(t[0]==='{'){try{const j=JSON.parse(t);for(const k of['detail','error','message']){const v=j[k];if(v!=null)return 'HTTP '+r.code+': '+String(typeof v==='string'?v:JSON.stringify(v)).slice(0,200)}}catch(e){}}
  return 'HTTP '+r.code;
}
function vLogout(){vTok='';vExp=0;LS.set('vpn_refresh','');LS.set('vpn_pay','')}
const vLoggedIn=()=>!!vRef()||(vTok&&Date.now()<vExp);
function vSave(j,refresh){
  const s=j.session||j,tok=s.access_token;
  if(!tok)throw new Error('Сервер не вернул токен');
  vTok=tok;vExp=Date.now()+(Number(s.expires_in)||3600)*1000;
  if(refresh)LS.set('vpn_refresh',refresh);
}
async function vDoRefresh(){
  const rc=vRef();if(!rc)throw new VpnAuth('Нужно войти заново');
  let last=0;
  // как сайт шлёт это продление (POST или GET) — из адресов не видно, пробуем по очереди
  for(const [m,b] of [['POST',null],['POST','{}'],['GET',null]]){
    const r=await vraw(m,VPN_AUTH+'/auth/refresh',b,{refresh:rc});
    if(vOk(r)){vSave(JSON.parse(r.text),r.refresh);return}
    last=r.code;
    if(r.code===401||r.code===403){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  throw new Error('Не удалось продлить сессию (код '+last+')');
}
async function vEnsure(){
  if(vTok&&Date.now()<vExp-60000)return vTok;
  if(!vRefreshing)vRefreshing=vDoRefresh().finally(()=>{vRefreshing=null});
  await vRefreshing;return vTok;
}
async function vAuthed(m,p,b){
  let r=await vraw(m,p,b,{bearer:await vEnsure()});
  if(r.code===401){
    vExp=0;r=await vraw(m,p,b,{bearer:await vEnsure()});
    if(r.code===401){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  if(!vOk(r))throw new Error(vErr(r));
  return r.text;
}
const vj=(o)=>JSON.stringify(o);
const vget=async(p)=>JSON.parse(await vAuthed('GET',p));
const vpost=async(p,o)=>JSON.parse(await vAuthed('POST',p,vj(o)));

// ---------- капча сайта (ALTCHA, подбор по PBKDF2) ----------
function vFail(r,path){
  if(r.code===429)return new VpnFail('Слишком много попыток. Подождите немного.');
  let code='',reason='',msg='';
  try{const j=JSON.parse((r.text||'').trim());code=j.code||'';reason=(j.context&&j.context.reason)||'';for(const k of['message','detail','error']){if(typeof j[k]==='string'&&j[k]){msg=j[k];break}}}catch(e){}
  if(code==='app.captcha'){
    return new VpnFail(reason==='captcha_replay'?'Проверка устарела. Попробуйте ещё раз.':reason==='captcha_missing'?'Проверка ещё не завершилась. Подождите секунду и повторите.':'Проверка не пройдена. Попробуйте ещё раз.',true);
  }
  if(r.code===404||r.code===405)return new VpnFail('Сервер не знает адрес '+path+' (HTTP '+r.code+')');
  return new VpnFail(msg?msg.slice(0,200)+' (HTTP '+r.code+')':'Ошибка сервера (HTTP '+r.code+')');
}
// объект по ключу «как есть»: подпись капчи считается по исходному порядку полей
function rawObject(text,key){
  const k=text.indexOf('"'+key+'"');if(k<0)throw new Error('Капча: в ответе нет поля '+key);
  const st=text.indexOf('{',k);if(st<0)throw new Error('Капча: не удалось разобрать ответ');
  let d=0,inS=false,esc2=false;
  for(let i=st;i<text.length;i++){
    const c=text[i];
    if(inS){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inS=false}
    else if(c==='"')inS=true;else if(c==='{')d++;else if(c==='}'){d--;if(d===0)return text.slice(st,i+1)}
  }
  throw new Error('Капча: не удалось разобрать ответ');
}
const hexToBytes=(h)=>{if(h.length%2)throw new Error('Капча: неверное hex-значение');const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};
const bytesToHex=(b)=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function solveCaptcha(ref){
  const r=await vraw('GET','/api/captcha/challenge',null,{ref});
  if(!vOk(r))throw vFail(r,'/api/captcha/challenge');
  const j=JSON.parse(r.text);
  if('enabled' in j&&!j.enabled)return '';
  const p=j.parameters,sig=j.signature,rawParams=rawObject(r.text,'parameters');
  const hash={'PBKDF2/SHA-256':'SHA-256','PBKDF2/SHA-384':'SHA-384','PBKDF2/SHA-512':'SHA-512'}[p.algorithm||'PBKDF2/SHA-256'];
  if(!hash)throw new Error('Капча: неизвестный алгоритм '+p.algorithm);
  const cost=p.cost,keyLen=p.keyLength||32,prefix=String(p.keyPrefix).toLowerCase();
  const nonce=hexToBytes(p.nonce),salt=hexToBytes(p.salt);
  const t0=Date.now(),deadline=t0+90000;let found=null,next=0;
  async function work(){
    while(!found&&Date.now()<deadline){
      const counter=next++,pwd=new Uint8Array(nonce.length+4);
      pwd.set(nonce);new DataView(pwd.buffer).setUint32(nonce.length,counter>>>0,false); // счётчик — 4 байта, старший первым
      const key=await crypto.subtle.importKey('raw',pwd,'PBKDF2',false,['deriveBits']);
      const hex=bytesToHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash,salt,iterations:cost},key,keyLen*8));
      if(hex.startsWith(prefix)&&!found)found={counter,hex};
    }
  }
  await Promise.all([work(),work(),work(),work()]);
  if(!found)throw new Error('Не удалось пройти проверку за 90 секунд');
  const sol=vj({counter:found.counter,derivedKey:found.hex,time:Date.now()-t0});
  const payload='{"challenge":{"parameters":'+rawParams+',"signature":'+vj(sig)+'},"solution":'+sol+'}';
  return btoa(unescape(encodeURIComponent(payload)));
}
async function authPost(path,body,ref,withCaptcha){
  if(withCaptcha){const cap=await solveCaptcha(ref);if(cap)body.captcha=cap}
  const r=await vraw('POST',path,vj(body),{ref});
  if(!vOk(r))throw vFail(r,path);
  return r;
}

// ---------- запросы кабинета ----------
const VP={
  async startLogin(){const r=await vraw('POST',VPN_AUTH+'/telegram-login',vj({slug:null}));if(!vOk(r))throw new Error(vErr(r));return JSON.parse(r.text)},

// ---------- подписи ----------
const vRub=(minor)=>Math.floor((Number(minor)+99)/100)+' ₽';
function plural(n,a,b,c){const m100=n%100,m10=n%10;return n+' '+(m100>=11&&m100<=14?c:m10===1?a:(m10>=2&&m10<=4)?b:c)}
const vDays=(n)=>plural(n|0,'день','дня','дней');
const vDevs=(n)=>plural(n|0,'устройство','устройства','устройств');
function vDate(s){const d=String(s||'').slice(0,10).split('-');return d.length===3?d[2]+'.'+d[1]+'.'+d[0]:String(s||'')}
function vDateTime(s){s=String(s||'');if(s.length<16)return s;const d=s.slice(0,10).split('-');return d.length===3?d[2]+'.'+d[1]+' '+s.slice(11,16):s}
const vPlanName=(n)=>String(n||'').charAt(0).toUpperCase()+String(n||'').slice(1);
const vGb=(b)=>(Number(b)/1073741824).toFixed(1).replace('.',',')+' ГБ';
const vProv=(id)=>({platega:'СБП',aurapay:'СБП 2',antilopay:'СБП 3',cryptobot:'CryptoBot (через Telegram)',xrocket:'xRocket (через Telegram)',lzt:'LZT Market'}[id]||id);
function vPlanLabel(p){
  const tag=p.is_special?' · особый':p.is_popular?' · популярный':'';
  return vPlanName(p.name)+' · '+vDevs(p.devices)+' — '+vRub(p.total_price_display)+tag;
}
// статус платежа: 2 — готово, 3 — отменён/истёк, остальное — ждём
function statusKind(raw){
  const s=String(raw||'').toLowerCase().trim();
  if(!s)return 4;
  if(['completed','complete','done','delivered','success','succeeded','fulfilled','finished','sent'].includes(s))return 2;
  if(['cancel','fail','expire','refund','reject','error'].some(x=>s.includes(x)))return 3;
  if(['complet','success','fulfil','finish'].some(x=>s.includes(x)))return 2;
  if(['paid','process','progress','deliver','confirm','send','queue','work'].some(x=>s.includes(x)))return 1;
  if(['pend','wait','new','creat','unpaid','await'].some(x=>s.includes(x)))return 0;
  return 4;
}

// ---------- мелкие окна ----------
function toast(t){

}

// ---------- экран ----------
async function vpnScreen(){

  view.innerHTML='<h2>VPN</h2><div id="vp" class="vp"></div>';

// ---------- вход: Telegram и почта ----------
function vLoginView(box,alive){
  box.innerHTML='<div class="card"><b style="font-size:18px">Вход через Telegram</b><div class="mute small" style="margin:6px 0 10px">Откроется бот Pharm VPN. Нажмите в нём Start и вернитесь в приложение — вход подтвердится сам.</div><button class="b" id="tg">Войти через Telegram</button><div class="mute small" id="tgi" style="margin-top:8px"></div></div><div class="card" id="em"></div>';
  const info=$('#tgi');
  function pollLogin(id,until){
    if(!alive())return;
    if(Date.now()>until){info.textContent='Время ожидания вышло. Нажмите кнопку ещё раз.';return}
    VP.pollLogin(id).catch(()=>'error').then((res)=>{
      if(!alive())return;
      if(res==='confirmed')return vpnScreen();
      if(res==='pending'||res==='error')setTimeout(()=>pollLogin(id,until),2000);
      else info.textContent='Вход не подтверждён ('+res+'). Нажмите кнопку ещё раз.';
    });
  }
  $('#tg').onclick=async()=>{
    if(vBusy)return;vBusy=true;
    const w=window.open('about:blank','_blank'); // открываем сразу, пока жив тап: иначе браузер заблокирует окно
    info.textContent='Создаём вход…';
    try{
      const r=await VP.startLogin(),url=String(r.bot_url||''),num=Number(r.number)||0;
      const until=Date.now()+(Number(r.expires_in)||300)*1000;
      if(!/^https:\/\//.test(url))throw new Error('Сайт не вернул ссылку на бота');
      info.innerHTML=(num?'Ждём подтверждение в Telegram… Номер входа: '+num:'Ждём подтверждение в Telegram…')+' <a href="'+esc(url)+'" target="_blank" rel="noopener">Открыть бота</a>';
      if(w)w.location.href=url;
      pollLogin(String(r.poll_id),until);
    }catch(x){if(w)w.close();info.textContent='Ошибка: '+x.message}
    finally{vBusy=false}
  };
  vEmailAuth($('#em'),alive);
}
function vEmailAuth(card,alive){
  let working=false,savedEmail='';
  const okMail=(s)=>/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(s);
  const tabs=(m)=>'<div style="margin-bottom:12px"><button class="chip '+(m==='login'?'on':'')+'" data-m="login">Войти</button><button class="chip '+(m==='reg'?'on':'')+'" data-m="reg">Регистрация</button></div>';
  function bind(){
    card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(!working)render(b.dataset.m)});
  }
  function task(info,wait,work,ok){
    if(working)return;working=true;info.style.color='var(--mute)';info.textContent=wait;
    work().then(()=>{working=false;if(alive())ok()}).catch((e)=>{working=false;if(alive()){info.style.color='var(--red)';info.textContent=(e&&e.message)||'Не удалось выполнить запрос'}});
  }
  const fail=(info,m)=>{info.style.color='var(--red)';info.textContent=m};
  const link=(id,t)=>'<div class="lk" id="'+id+'">'+t+'</div>';
  function render(mode,step){
    if(mode==='login'){
      card.innerHTML=tabs('login')+'<b style="font-size:18px">Вход по почте</b><div style="height:10px"></div><input id="e" type="email" autocomplete="email" placeholder="Почта" value="'+esc(savedEmail)+'"><div style="height:8px"></div><input id="p" type="password" autocomplete="current-password" placeholder="Пароль"><button class="b" id="go">Войти</button><div class="small mute" id="i" style="margin-top:8px"></div>'+link('fg','Забыли пароль?');
      bind();const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(!p)return fail(info,'Введите пароль');
        task(info,'Входим…',()=>VP.loginEmail(e,p),()=>vpnScreen());
      };
      $('#fg',card).onclick=()=>{if(working)return;savedEmail=$('#e',card).value.trim();render('reset')};
    }else if(mode==='reg'&&!step){
      card.innerHTML=tabs('reg')+'<b style="font-size:18px">Регистрация</b><div class="mute small" style="margin:6px 0 10px">Укажите почту и придумайте пароль — пришлём код подтверждения.</div><input id="e" type="email" autocomplete="email" placeholder="Почта" value="'+esc(savedEmail)+'"><div style="height:8px"></div><input id="p" type="password" autocomplete="new-password" placeholder="Пароль"><button class="b" id="go">Получить код</button><div class="small mute" id="i" style="margin-top:8px"></div>';
      bind();const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        task(info,'Проверка и отправка кода… это займёт несколько секунд',()=>VP.registerRequest(e,p),()=>render('reg',{pwd:p}));
      };
    }else if(mode==='reg'){
      const pwd=step.pwd;
      card.innerHTML=tabs('reg')+'<b style="font-size:18px">Код из письма</b><div class="mute small" style="margin:6px 0 10px">Код отправлен на '+esc(savedEmail)+'</div><input id="c" inputmode="numeric" placeholder="Код из письма"><button class="b" id="go">Подтвердить</button><div class="small mute" id="i" style="margin-top:8px"></div>'+link('rs','Отправить код ещё раз')+link('ch','Изменить почту или пароль');
      bind();const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim();if(!c)return fail(info,'Введите код из письма');
        task(info,'Подтверждаем…',()=>VP.registerConfirm(savedEmail,c,pwd),()=>vpnScreen());
      };
      $('#rs',card).onclick=()=>task(info,'Проверка и отправка кода… это займёт несколько секунд',()=>VP.registerRequest(savedEmail,pwd),()=>{info.style.color='var(--mute)';info.textContent='Код отправлен ещё раз'});
      $('#ch',card).onclick=()=>{if(!working)render('reg')};
    }else if(mode==='reset'&&!step){
      card.innerHTML='<b style="font-size:18px">Сброс пароля</b><div class="mute small" style="margin:6px 0 10px">Пришлём код на почту — по нему можно задать новый пароль.</div><input id="e" type="email" autocomplete="email" placeholder="Почта" value="'+esc(savedEmail)+'"><button class="b" id="go">Получить код</button><div class="small mute" id="i" style="margin-top:8px"></div>'+link('bk','Назад ко входу');
      const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim();savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        task(info,'Проверка и отправка кода… это займёт несколько секунд',()=>VP.resetRequest(e),()=>render('reset',{sent:1}));
      };
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }else{
      card.innerHTML='<b style="font-size:18px">Сброс пароля</b><div class="mute small" style="margin:6px 0 10px">Код отправлен на '+esc(savedEmail)+'</div><input id="c" inputmode="numeric" placeholder="Код из письма"><div style="height:8px"></div><input id="p" type="password" autocomplete="new-password" placeholder="Новый пароль"><button class="b" id="go">Сменить пароль</button><div class="small mute" id="i" style="margin-top:8px"></div>'+link('rs','Отправить код ещё раз')+link('bk','Назад ко входу');
      const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim(),p=$('#p',card).value;
        if(!c)return fail(info,'Введите код из письма');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        let signed=false;
        task(info,'Меняем пароль…',async()=>{signed=await VP.resetConfirm(savedEmail,c,p)},()=>{
          if(signed)vpnScreen();else{toast('Пароль изменён — войдите с новым');render('login')}
        });
      };
      $('#rs',card).onclick=()=>task(info,'Проверка и отправка кода…',()=>VP.resetRequest(savedEmail),()=>{info.style.color='var(--mute)';info.textContent='Код отправлен ещё раз'});
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }
  }
  render('login');
}

// ---------- подписки и покупка ----------
let vTabSel=-1;
function vForm(box,alive,subs,plansAll,prov){
  const methods=(prov.providers||[]).filter(Boolean).map(id=>[id,vProv(id)]);
  const list=plansAll.filter(p=>!p.is_lifetime).sort((a,b)=>(a.days-b.days)||(a.total_price_display-b.total_price_display)); // бессрочные не берём
  const canBuy=list.length>0&&methods.length>0;
  const S={tab:(vTabSel===0||vTabSel===1)?vTabSel:(subs.length>0?0:1),
    plan:list.find(p=>p.is_popular)||list[0]||{},method:methods.length?methods[0][0]:'',quote:null,qTok:0};
  box.innerHTML='<div id="pb"></div><div class="seg"><button data-tab="0">Моя подписка</button><button data-tab="1">Купить подписку</button></div><div id="vc"></div>';
  const vc=$('#vc',box);

  // платёж создан, но ещё не подтверждён
  function paintPending(){
    const id=LS.get('vpn_pay'),pb=$('#pb',box);
    if(!id){pb.innerHTML='';return}
    pb.innerHTML='<div class="card" style="border-color:var(--blue)"><div id="pw">⏳ Ждём подтверждение оплаты…</div><div class="g2" style="margin-top:10px"><button class="gb pr" id="pn">Проверить сейчас</button><button class="gb" id="px">Не жду</button></div></div>';
    $('#pn',box).onclick=()=>{$('#pw',box).textContent='⏳ Проверяем оплату…';pollPay(id,0,++vPollGen)};
    $('#px',box).onclick=()=>{LS.set('vpn_pay','');vPollGen++;paintPending()};
  }
  function pollPay(id,tries,gp){
    if(!alive()||gp!==vPollGen)return;
    VP.paymentStatus(id).then((j)=>{
      const st=j.status;
      return (j.fulfillment==='done'||statusKind(st)===2)?'done':statusKind(st)===3?'failed':'wait';
    }).catch((e)=>e instanceof VpnAuth?'auth':'wait').then((res)=>{
      if(!alive()||gp!==vPollGen)return;
      const pw=$('#pw',box);
      if(res==='done'){LS.set('vpn_pay','');toast('Оплата прошла — подписка готова');vpnScreen()}
      else if(res==='failed'){LS.set('vpn_pay','');toast('Платёж отменён или истёк');vpnScreen()}
      else if(res==='auth')vpnScreen();
      else if(tries>=60){if(pw)pw.textContent='Оплата пока не подтвердилась. Нажмите «Проверить сейчас» после оплаты.'}
      else{if(pw)pw.textContent='⏳ Ждём подтверждение оплаты…';setTimeout(()=>pollPay(id,tries+1,gp),4000)}
    });
  }
  // вернулись во вкладку после оплаты — проверяем сразу
  const onVis=()=>{if(document.visibilityState==='visible'&&alive()&&LS.get('vpn_pay'))pollPay(LS.get('vpn_pay'),0,++vPollGen);else if(!alive())document.removeEventListener('visibilitychange',onVis)};
  document.addEventListener('visibilitychange',onVis);

  // создаёт платёж (покупка, продление, трафик, пополнение) и открывает страницу оплаты
  async function payWith(note,create){
    if(vBusy)return;vBusy=true;
    const w=window.open('about:blank','_blank'); // пока жив тап, иначе окно оплаты заблокируют
    note.hidden=false;note.textContent='Создаём платёж…';
    try{
      const r=await create(),id=r.payment_id||'',url=String(r.invoice_url||'');
      if(id)LS.set('vpn_pay',id);
      if(!/^https:\/\//.test(url)){if(w)w.close();note.textContent='Сайт не вернул ссылку на оплату';return}
      note.innerHTML='Платёж создан. Если страница оплаты не открылась — <a href="'+esc(url)+'" target="_blank" rel="noopener">откройте её здесь</a>.';
      if(w)w.location.href=url;
      if(id){paintPending();pollPay(id,0,++vPollGen)}
    }catch(x){
      if(w)w.close();
      if(x instanceof VpnAuth)return vpnScreen();
      note.textContent='Ошибка: '+x.message;
    }finally{vBusy=false}
  }
  const guard=(fn)=>async(...a)=>{try{await fn(...a)}catch(x){if(x instanceof VpnAuth)vpnScreen();else toast('Ошибка: '+x.message)}};

  // ---------- вкладка «Моя подписка» ----------
  function subCard(s,i){
    const active=!!s.is_active,url=String(s.subscription_url||''),lim=Number(s.traffic_limit_bytes)||0;
    const name=vPlanName(s.plan_name||'Подписка'),end=vDate(s.end_date);
    const line=s.is_frozen?'Заморожена · до '+end:active?'Активна · осталось '+vDays(s.days_left)+' · до '+end:'Не активна · до '+end;
    const sid=VP.subId(s);
    let h='<div class="card" data-i="'+i+'" style="'+(active?'border-color:var(--blue)':'')+'"><b style="font-size:16px">'+esc(name)+' · '+vDevs(s.devices)+'</b>';
    h+='<div class="small" style="margin:4px 0 8px;color:'+(active?'var(--green)':'var(--mute)')+'">'+esc(line)+'</div>';
    if(lim>0)h+='<div class="small mute" style="margin-bottom:8px">Трафик: '+vGb(s.used_traffic_bytes)+' из '+vGb(lim)+'</div>';
    const acts=[];
    if(/^https:\/\//.test(url)){
      h+='<div class="lnk">'+esc(url)+'</div>';
      acts.push(['copy','Скопировать ссылку',1],['client','Открыть в клиенте']);
    }
    if(sid){
      acts.push(['renew','Продлить',1]);
      if(!s.is_trial&&!s.is_lifetime)acts.push(['upg','Больше устройств']);
      acts.push([s.is_frozen?'unfreeze':'freeze',s.is_frozen?'Разморозить':'Заморозить']);
      acts.push(['rot','Обновить ссылку']);
      if(lim>0)acts.push(['traf','Докупить трафик']);
      acts.push(['devs','Устройства']);
    }
    h+='<div class="g2">'+acts.map(a=>'<button class="gb'+(a[2]?' pr':'')+'" data-act="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
    h+='<div class="small mute" data-note hidden style="margin-top:8px"></div><div data-devs hidden style="margin-top:8px"></div></div>';
    return h;
  }
  function fillMine(){
    let h='';
    if(!subs.length)h='<div class="card"><b style="font-size:16px">Подписки пока нет</b><div class="mute small" style="margin:4px 0 12px">Выберите тариф на вкладке «Купить подписку» — ключ появится здесь сразу после оплаты.</div><button class="b" data-act="tobuy">Купить подписку</button></div>';
    else h=subs.map(subCard).join('');
    const ex=[];
    if(methods.length)ex.push('<button class="gb" data-act="topup">Пополнить баланс</button>');
    ex.push('<button class="gb" data-act="out">Выйти из аккаунта VPN</button>');
    h+='<div class="g2">'+ex.join('')+'</div><div class="small mute" id="tn" hidden style="margin-top:8px"></div>';
    vc.innerHTML=h;
  }

  // ---------- вкладка «Купить подписку» ----------
  function paintTotal(){
    const q=S.quote;let minor=-1;
    if(q){const bp=q.provider_totals&&q.provider_totals[S.method];minor=(bp!=null&&bp>=0)?bp:(q.total_display_minor!=null?q.total_display_minor:-1)}
    const t=$('#tot',box);if(t)t.textContent=minor>=0?vRub(minor):'—';
  }
  function requestQuote(){
    const my=++S.qTok,uuid=S.plan.uuid;S.quote=null;
    const cap=$('#cap',box);if(cap)cap.textContent='К оплате · '+vDays(S.plan.days);
    const t=$('#tot',box);if(t)t.textContent='…';
    VP.quote(uuid).then((r)=>{if(my===S.qTok&&alive()){S.quote=r;paintTotal()}}).catch(()=>{if(my===S.qTok&&alive()){const t2=$('#tot',box);if(t2)t2.textContent='—'}});
  }
  function fillBuy(){
    if(!canBuy){vc.innerHTML='<div class="mute">Покупка VPN сейчас недоступна</div>';return}
    const dayVals=[...new Set(list.map(p=>p.days))];
    const opt=(v,t,sel)=>'<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(t)+'</option>';
    const levels=()=>list.filter(p=>p.days===S.plan.days).map(p=>opt(p.uuid,vPlanLabel(p),p.uuid===S.plan.uuid)).join('');
    vc.innerHTML='<label class="mute small">Срок</label><select id="sd">'+dayVals.map(d=>opt(d,vDays(d),d===S.plan.days)).join('')+'</select>'
      +'<label class="mute small">Уровень подписки</label><select id="sl">'+levels()+'</select>'
      +'<label class="mute small">Способ оплаты</label><select id="sm">'+methods.map(m=>opt(m[0],m[1],m[0]===S.method)).join('')+'</select>'
      +'<div class="paybar"><div style="flex:1"><div class="mute small" id="cap">К оплате</div><div id="tot" style="font-size:20px;font-weight:700">—</div></div><button class="b" id="pay" style="width:auto;margin:0;padding:12px 26px">Оплатить</button></div><div class="small mute" id="pi" hidden style="margin-top:8px"></div>';
    $('#sd',vc).onchange=(e)=>{
      const d=Number(e.target.value),inDays=list.filter(p=>p.days===d);
      S.plan=inDays.find(p=>p.name===S.plan.name)||inDays.find(p=>p.is_popular)||inDays[0];
      $('#sl',vc).innerHTML=levels();requestQuote();
    };
    $('#sl',vc).onchange=(e)=>{S.plan=list.find(p=>p.uuid===e.target.value)||S.plan;requestQuote()};
    $('#sm',vc).onchange=(e)=>{S.method=e.target.value;paintTotal()};
    $('#pay',vc).onclick=()=>payWith($('#pi',vc),()=>VP.intent(S.plan.uuid,S.method));
    requestQuote();
  }
  function showTab(){
    box.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',Number(b.dataset.tab)===S.tab));
    S.tab===0?fillMine():fillBuy();
  }
  box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const t=Number(b.dataset.tab);if(S.tab!==t){S.tab=t;vTabSel=t;showTab()}});

  // ---------- действия ----------
  const pickMethod=(title,cb)=>listSheet(title,methods.map(m=>m[1]),(i)=>cb(methods[i][0]));
  function askTopup(note,prefillMinor){
    const prefill=prefillMinor>0?String(Math.floor((prefillMinor+99)/100)):'';
    inputSheet('Пополнить баланс','сумма, ₽',prefill,(text)=>{
      const rub=parseInt(text,10);
      if(!(rub>=1)){toast('Введите сумму в рублях');return false}
      pickMethod('Способ оплаты',(prov2)=>payWith(note,()=>VP.topup(rub*100,prov2)));
    });
  }
  function pickRenewDays(sid,note){
    const opts=['1 месяц','7 дней','14 дней','60 дней','90 дней','Свой срок…'],vals=[null,7,14,60,90,-1];
    listSheet('На сколько продлить?',opts,(i)=>{
      if(vals[i]===-1)inputSheet('Свой срок, дней','от 3 до 365','',(t)=>{
        const n=parseInt(t,10);if(!(n>=3&&n<=365)){toast('Введите число от 3 до 365');return false}
        quoteRenew(sid,note,n);
      });
      else quoteRenew(sid,note,vals[i]);
    });
  }
  async function quoteRenew(sid,note,days){
    note.hidden=false;note.textContent='Считаем цену…';
    let q=null;
    try{q=await VP.renewQuote(sid,days)}
    catch(e){if(e instanceof VpnAuth)return vpnScreen()} // цену узнать не вышло — продлить всё равно можно
    note.hidden=true;
    const totals=q&&q.provider_totals;
    const items=methods.map(([id,name])=>{const m=totals&&totals[id];return m!=null&&m>=0?name+' — '+vRub(m):name});
    const end=String((q&&q.new_end_date)||'');
    const title=end.length>=10?'Продлить до '+vDate(end):'Продлить подписку';
    listSheet(title,items,(i)=>payWith(note,()=>VP.renew(sid,methods[i][0],days)));
  }
  async function startUpgrade(s,sid,note){
    note.hidden=false;note.textContent='Считаем доплату…';
    try{
      const days=s.days,dev=s.devices,cur=s.plan_uuid;
      const plans=await VP.plans();
      const cands=plans.filter(p=>!p.is_lifetime&&p.days===days&&p.devices>dev&&p.uuid!==cur).sort((a,b)=>a.devices-b.devices);
      const ok=[];let lastErr=null;
      for(const p of cands){try{ok.push([p,await VP.upgradeQuote(sid,p.uuid)])}catch(e){if(e instanceof VpnAuth)throw e;lastErr=e}}
      let balance=-1;
      try{balance=(await VP.profile()).balance_display_minor}catch(e){if(e instanceof VpnAuth)throw e}
      if(balance==null)balance=-1;
      note.hidden=true;
      if(!cands.length)return toast('Тарифов с большим числом устройств нет');
      if(!ok.length){note.hidden=false;note.textContent='Не удалось посчитать доплату: '+(lastErr&&lastErr.message);return}
      const items=ok.map(([p,q])=>vPlanName(p.name)+' · '+vDevs(p.devices)+' — доплата '+vRub(q.charged_display_minor));
      listSheet('Больше устройств',items,(i)=>{
        const [p,q]=ok[i],charge=Number(q.charged_display_minor)||0,name=vPlanName(p.name)+' · '+vDevs(p.devices);
        if(q.enough_balance===false){
          const have=balance>=0?'На балансе '+vRub(balance)+'.':'';
          confirmSheet('Не хватает баланса','Нужно '+vRub(charge)+'. '+have+' Пополните баланс и повторите.','Пополнить',()=>{
            const need=balance>=0?charge-balance:charge;askTopup(note,need>0?need:charge);
          });
        }else confirmSheet('Перейти на «'+name+'»?','С баланса спишется '+vRub(charge)+'. Срок подписки не изменится.','Перейти',guard(async()=>{
          if(vBusy)return;vBusy=true;
          try{await VP.upgrade(sid,p.uuid);toast('Тариф изменён');vpnScreen()}finally{vBusy=false}
        }));
      });
    }catch(e){
      if(e instanceof VpnAuth)return vpnScreen();
      note.hidden=false;note.textContent='Не удалось загрузить тарифы: '+e.message;
    }
  }
  async function loadDevices(card,sid){
    const dv=$('[data-devs]',card);dv.innerHTML='<div class="small mute">Загружаем устройства…</div>';
    try{
      const devs=await VP.devices(sid);
      let blocks=[];try{blocks=await VP.deviceBlocks(sid)}catch(e){if(e instanceof VpnAuth)throw e}
      let h='<b>Устройства: '+devs.length+'</b>';
      if(!devs.length)h+='<div class="small mute">Пока ни одно устройство не подключено</div>';
      devs.forEach((d,k)=>{
        const nm=d.name||d.model||'Устройство';
        const sub=[d.os,d.ip,'был '+vDateTime(d.last_seen)].filter(x=>x&&x!=='null').join(' · ');
        h+='<div class="dm"><div><div>'+esc(nm)+'</div><div class="small mute">'+esc(sub)+'</div></div><button class="chip" data-dd="'+k+'" style="margin:0">Отключить</button></div>';
      });
      if(blocks.length){
        h+='<div class="small mute" style="margin-top:8px">Отключённые</div>';
        blocks.forEach((b,k)=>{h+='<div class="dm"><div><div>'+esc(b.name||'Устройство')+'</div><div class="small mute">отключено '+esc(vDateTime(b.blocked_at))+'</div></div><button class="chip" data-du="'+k+'" style="margin:0">Вернуть</button></div>'});
      }
      dv.innerHTML=h;
      dv.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{
        const d=devs[Number(b.dataset.dd)],nm=d.name||d.model||'Устройство';
        confirmSheet('Отключить «'+nm+'»?','Устройство потеряет доступ. Вернуть его можно в списке отключённых.','Отключить',guard(async()=>{
          await VP.disconnectDevice(sid,d.id);toast('Устройство отключено');loadDevices(card,sid);
        }),true);
      });
      dv.querySelectorAll('[data-du]').forEach(b=>b.onclick=guard(async()=>{
        await VP.unblockDevice(sid,blocks[Number(b.dataset.du)].hwid);toast('Устройство возвращено');loadDevices(card,sid);
      }));
    }catch(e){
      if(e instanceof VpnAuth)return vpnScreen();
      dv.innerHTML='<div class="small mute">Не удалось загрузить: '+esc(e.message)+'</div>';
    }
  }
  async function copyText(t){
    try{await navigator.clipboard.writeText(t);return true}catch(e){}
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
  }

  box.addEventListener('click',(e)=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const act=b.dataset.act,card=b.closest('[data-i]');
    const s=card?subs[Number(card.dataset.i)]:null,sid=s?VP.subId(s):'';
    const note=card?$('[data-note]',card):$('#tn',box);
    if(act==='tobuy'){S.tab=1;vTabSel=1;showTab()}
    else if(act==='topup')askTopup(note);
    else if(act==='out')confirmSheet('Выйти из аккаунта VPN?','Ключ входа будет удалён с этого устройства. Войти снова можно через Telegram или почту.','Выйти',()=>{vLogout();vTabSel=-1;vPollGen++;vpnScreen()});
    else if(act==='copy'){copyText(s.subscription_url).then(ok=>toast(ok?'Ссылка подписки скопирована':'Не удалось скопировать — выделите ссылку вручную'))}
    else if(act==='client'){
      const url=s.subscription_url,apps=[['Happ','happ://add/'+url],['v2rayTun','v2raytun://import/'+url],['Hiddify','hiddify://import/'+url]];
      listSheet('Открыть в приложении',apps.map(a=>a[0]),(i)=>{toast('Если '+apps[i][0]+' не открылся — скопируйте ссылку и добавьте подписку вручную');location.href=apps[i][1]});
    }
    else if(act==='renew'){if(!vBusy)pickRenewDays(sid,note)}
    else if(act==='upg'){if(!vBusy)startUpgrade(s,sid,note)}
    else if(act==='freeze'||act==='unfreeze'){
      const frozen=act==='unfreeze';
      const go=guard(async()=>{
        if(vBusy)return;vBusy=true;
        try{await(frozen?VP.unfreeze(sid):VP.freeze(sid));toast(frozen?'Подписка разморожена':'Подписка заморожена');vpnScreen()}finally{vBusy=false}
      });
      if(frozen)go();else confirmSheet('Заморозить подписку?','Подписка будет приостановлена. Разморозить её можно в любой момент.','Заморозить',go);
    }
    else if(act==='rot'){
      const avail=String(s.link_rotation_available_at||''),now=new Date().toISOString().slice(0,19);
      if(avail.length>=19&&avail!=='null'&&avail.slice(0,19)>now)return toast('Ссылку можно обновить с '+vDateTime(avail));
      confirmSheet('Обновить ссылку?','Старая ссылка перестанет работать, и по ней больше никто не подключится. Кто уже подключился по ней, останется до конца срока подписки.','Обновить',guard(async()=>{
        if(vBusy)return;vBusy=true;
        try{await VP.rotateLink(sid);toast('Ссылка обновлена');vpnScreen()}finally{vBusy=false}
      }));
    }
    else if(act==='traf'){
      if(vBusy)return;note.hidden=false;note.textContent='Загружаем пакеты…';
      VP.trafficPacks(sid).then((packs)=>{
        note.hidden=true;
        if(!packs.length)return toast('Пакетов трафика сейчас нет');
        const items=packs.map(p=>p.gb+' ГБ — '+vRub(p.total_display));
        listSheet('Докупить трафик',items,(i)=>pickMethod('Способ оплаты',(prov2)=>payWith(note,()=>VP.trafficIntent(sid,packs[i].gb,prov2))));
      }).catch((x)=>{if(x instanceof VpnAuth)vpnScreen();else note.textContent='Не удалось загрузить пакеты: '+x.message});
    }
    else if(act==='devs'){
      const dv=$('[data-devs]',card);
      if(!dv.hidden){dv.hidden=true;return}
      dv.hidden=false;if(!dv.dataset.ok){dv.dataset.ok=1;loadDevices(card,sid)}
    }
  });

  paintPending();showTab();
  const pend=LS.get('vpn_pay');if(pend)pollPay(pend,0,++vPollGen);
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go(tab);
</script>
<script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
</body></html>
