async function shrinkImg(file){

  try{
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});

      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);

    cropSheet({title:'Фото профиля',file:f,r:1,round:true,out:[192,192],done:async(c)=>{
      let q=.9,b64='';do{b64=c.toDataURL('image/jpeg',q).split(',')[1];q-=.1}while(b64.length>55000&&q>.2);

// Запросы идут через воркер (/api/vpn/call): он подставляет cookie входа и отдаёт новый. Суммы сервер присылает в копейках.
const VPN_AUTH='/api/client/web';
class VpnAuth extends Error{}
class VpnFail extends Error{constructor(m,captcha){super(m);this.captcha=!!captcha}}
let vTok='',vExp=0,vBusy=false,vsid=0,vPollGen=0,vRefreshing=null,cfgP=null;
const vRef=()=>LS.get('vpn_refresh');
const vOk=(r)=>r.code>=200&&r.code<300;

async function vraw(m,p,b,o={}){
  const r=await fetch(API+'/api/vpn/call',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({device,m,p,b:b==null?null:String(b),bearer:o.bearer||'',refresh:o.refresh||'',ref:o.ref||'/app/plans'})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('Ошибка '+r.status));
  return j; // {code,text,refresh}
}
function vErr(r){
  const t=(r.text||'').trim();
  if(t[0]==='{'){try{const j=JSON.parse(t);for(const k of['detail','error','message']){const v=j[k];if(v!=null)return 'HTTP '+r.code+': '+String(typeof v==='string'?v:JSON.stringify(v)).slice(0,200)}}catch(e){}}
  return 'HTTP '+r.code;
}
function vLogout(){vTok='';vExp=0;LS.set('vpn_refresh','');LS.set('vpn_pay','')}
const vLoggedIn=()=>!!vRef()||(vTok&&Date.now()<vExp);
function vSave(j,refresh){
  const s=j.session||j,tok=s.access_token;
  if(!tok)throw new Error('Сервер не вернул токен');
  vTok=tok;vExp=Date.now()+(Number(s.expires_in)||3600)*1000;
  if(refresh)LS.set('vpn_refresh',refresh);
}
async function vDoRefresh(){
  const rc=vRef();if(!rc)throw new VpnAuth('Нужно войти заново');
  let last=0;
  // как сайт шлёт это продление (POST или GET) — из адресов не видно, пробуем по очереди
  for(const [m,b] of [['POST',null],['POST','{}'],['GET',null]]){
    const r=await vraw(m,VPN_AUTH+'/auth/refresh',b,{refresh:rc});
    if(vOk(r)){vSave(JSON.parse(r.text),r.refresh);return}
    last=r.code;
    if(r.code===401||r.code===403){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  throw new Error('Не удалось продлить сессию (код '+last+')');
}
async function vEnsure(){
  if(vTok&&Date.now()<vExp-60000)return vTok;
  if(!vRefreshing)vRefreshing=vDoRefresh().finally(()=>{vRefreshing=null});
  await vRefreshing;return vTok;
}
async function vAuthed(m,p,b){
  let r=await vraw(m,p,b,{bearer:await vEnsure()});
  if(r.code===401){
    vExp=0;r=await vraw(m,p,b,{bearer:await vEnsure()});
    if(r.code===401){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  if(!vOk(r))throw new Error(vErr(r));
  return r.text;
}
const vj=(o)=>JSON.stringify(o);
const vget=async(p)=>JSON.parse(await vAuthed('GET',p));
const vpost=async(p,o)=>JSON.parse(await vAuthed('POST',p,vj(o)));

// ---------- капча сайта (ALTCHA, подбор по PBKDF2) ----------
function vFail(r,path){
  if(r.code===429)return new VpnFail('Слишком много попыток. Подождите немного.');
  let code='',reason='',msg='';
  try{const j=JSON.parse((r.text||'').trim());code=j.code||'';reason=(j.context&&j.context.reason)||'';for(const k of['message','detail','error']){if(typeof j[k]==='string'&&j[k]){msg=j[k];break}}}catch(e){}
  if(code==='app.captcha'){
    return new VpnFail(reason==='captcha_replay'?'Проверка устарела. Попробуйте ещё раз.':reason==='captcha_missing'?'Проверка ещё не завершилась. Подождите секунду и повторите.':'Проверка не пройдена. Попробуйте ещё раз.',true);
  }
  if(r.code===404||r.code===405)return new VpnFail('Сервер не знает адрес '+path+' (HTTP '+r.code+')');
  return new VpnFail(msg?msg.slice(0,200)+' (HTTP '+r.code+')':'Ошибка сервера (HTTP '+r.code+')');
}
// объект по ключу «как есть»: подпись капчи считается по исходному порядку полей
function rawObject(text,key){
  const k=text.indexOf('"'+key+'"');if(k<0)throw new Error('Капча: в ответе нет поля '+key);
  const st=text.indexOf('{',k);if(st<0)throw new Error('Капча: не удалось разобрать ответ');
  let d=0,inS=false,esc2=false;
  for(let i=st;i<text.length;i++){
    const c=text[i];
    if(inS){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inS=false}
    else if(c==='"')inS=true;else if(c==='{')d++;else if(c==='}'){d--;if(d===0)return text.slice(st,i+1)}
  }
  throw new Error('Капча: не удалось разобрать ответ');
}
const hexToBytes=(h)=>{if(h.length%2)throw new Error('Капча: неверное hex-значение');const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};
const bytesToHex=(b)=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function solveCaptcha(ref){
  const r=await vraw('GET','/api/captcha/challenge',null,{ref});
  if(!vOk(r))throw vFail(r,'/api/captcha/challenge');
  const j=JSON.parse(r.text);
  if('enabled' in j&&!j.enabled)return '';
  const p=j.parameters,sig=j.signature,rawParams=rawObject(r.text,'parameters');
  const hash={'PBKDF2/SHA-256':'SHA-256','PBKDF2/SHA-384':'SHA-384','PBKDF2/SHA-512':'SHA-512'}[p.algorithm||'PBKDF2/SHA-256'];
  if(!hash)throw new Error('Капча: неизвестный алгоритм '+p.algorithm);
  const cost=p.cost,keyLen=p.keyLength||32,prefix=String(p.keyPrefix).toLowerCase();
  const nonce=hexToBytes(p.nonce),salt=hexToBytes(p.salt);
  const t0=Date.now(),deadline=t0+90000;let found=null,next=0;
  async function work(){
    while(!found&&Date.now()<deadline){
      const counter=next++,pwd=new Uint8Array(nonce.length+4);
      pwd.set(nonce);new DataView(pwd.buffer).setUint32(nonce.length,counter>>>0,false); // счётчик — 4 байта, старший первым
      const key=await crypto.subtle.importKey('raw',pwd,'PBKDF2',false,['deriveBits']);
      const hex=bytesToHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash,salt,iterations:cost},key,keyLen*8));
      if(hex.startsWith(prefix)&&!found)found={counter,hex};
    }
  }
  await Promise.all([work(),work(),work(),work()]);
  if(!found)throw new Error('Не удалось пройти проверку за 90 секунд');
  const sol=vj({counter:found.counter,derivedKey:found.hex,time:Date.now()-t0});
  const payload='{"challenge":{"parameters":'+rawParams+',"signature":'+vj(sig)+'},"solution":'+sol+'}';
  return btoa(unescape(encodeURIComponent(payload)));
}
async function authPost(path,body,ref,withCaptcha){
  if(withCaptcha){const cap=await solveCaptcha(ref);if(cap)body.captcha=cap}
  const r=await vraw('POST',path,vj(body),{ref});
  if(!vOk(r))throw vFail(r,path);
  return r;
}

const vRub=(minor)=>Math.floor((Number(minor)+99)/100)+' ₽';
function plural(n,a,b,c){const m100=n%100,m10=n%10;return n+' '+(m100>=11&&m100<=14?c:m10===1?a:(m10>=2&&m10<=4)?b:c)}
const vDays=(n)=>plural(n|0,'день','дня','дней');

const vPlanName=(n)=>String(n||'').charAt(0).toUpperCase()+String(n||'').slice(1);

  const tag=p.is_special?' · особый':p.is_popular?' · популярный':'';
  return vPlanName(p.name)+' · '+vDevs(p.devices)+' — '+vRub(p.total_price_display)+tag;
}
// статус платежа: 2 — готово, 3 — отменён/истёк, остальное — ждём
function statusKind(raw){
  const s=String(raw||'').toLowerCase().trim();
  if(!s)return 4;
  if(['completed','complete','done','delivered','success','succeeded','fulfilled','finished','sent'].includes(s))return 2;
  if(['cancel','fail','expire','refund','reject','error'].some(x=>s.includes(x)))return 3;
  if(['complet','success','fulfil','finish'].some(x=>s.includes(x)))return 2;
  if(['paid','process','progress','deliver','confirm','send','queue','work'].some(x=>s.includes(x)))return 1;
  if(['pend','wait','new','creat','unpaid','await'].some(x=>s.includes(x)))return 0;
  return 4;
}

}

<path class="cl-s" d="M200 40q0 8 8 8q-8 0-8 8q0-8-8-8q8 0 8-8z" fill="#FFB020"/><path class="cl-s" d="M16 14q0 6 6 6q-6 0-6 6q0-6-6-6q6 0 6-6z" fill="var(--blue)"/><path class="cl-s" d="M205 104q0 5 5 5q-5 0-5 5q0-5-5-5q5 0 5-5z" fill="var(--green)"/></svg>`;

  const btn=$('#clr'),cd=$('#clc');
  async function check(manual){
    if(busy||g!==gen)return;busy=true;btn.classList.add('ld');
    let c=null;try{c=await api('/api/app/config')}catch(e){}
    if(g!==gen)return;busy=false;btn.classList.remove('ld');left=30;
    if(!c){if(manual)toast('Нет связи с сервером');return}
    cfgP=Promise.resolve(c);const s=c.sections&&c.sections.chat;
    if(!s||s.enabled!==false){stop();toast('Чат снова открыт 🎉');chatTab();return}
    $('#clm').textContent=s.message||'Мы обновляем чат, чтобы он работал лучше. Это ненадолго.';
    if(manual)toast('Работы ещё идут — скоро закончим');
  }
  btn.onclick=()=>check(true);$('#cls').onclick=()=>go('help');$('#clv').onclick=()=>go('vpn');
  (function tick(){if(g!==gen)return;if(!busy){cd.textContent=Math.max(left,0);if(--left<0)check(false)}timer=setTimeout(tick,1000)})();
}

// ---------- вход: Telegram и почта ----------
function vLoginView(box,alive){
  box.innerHTML='<div class="vhero">'+vShield('')+'<span class="vorb o1">'+ic('paw',16)+'</span><span class="vorb o2">'+ic('fish',16)+'</span><h3>Защита в одно касание</h3><div class="mute small">Мяу! Войдите, чтобы купить подписку или управлять своей</div></div>'
  +'<button class="vbtn tg" id="tg">'+ic('send',20)+'<span>Войти через Telegram</span></button><div class="vinfo" id="tgi" hidden></div>'
  +'<div class="vor"><span>или по почте</span></div><div class="vcard" id="em"></div>';
  const info=$('#tgi'),tg=$('#tg');
  const say=(h,spin)=>{info.hidden=false;info.innerHTML=(spin?'<span class="vspn"></span>':'')+'<div style="flex:1">'+h+'</div>'};
  function pollLogin(id,until){
    if(!alive())return;
    if(Date.now()>until){tg.classList.remove('ld');say('Время ожидания вышло. Нажмите кнопку ещё раз.');return}
    VP.pollLogin(id).catch(()=>'error').then((res)=>{
      if(!alive())return;
      if(res==='confirmed')return vpnScreen();
      if(res==='pending'||res==='error')setTimeout(()=>pollLogin(id,until),2000);
      else{tg.classList.remove('ld');say('Вход не подтверждён ('+esc(res)+'). Нажмите кнопку ещё раз.')}
    });
  }
  tg.onclick=async()=>{
    if(vBusy)return;vBusy=true;tg.classList.add('ld');
    const w=window.open('about:blank','_blank'); // открываем сразу, пока жив тап: иначе браузер заблокирует окно
    say('Создаём вход…',1);
    try{
      const r=await VP.startLogin(),url=String(r.bot_url||''),num=Number(r.number)||0;
      const until=Date.now()+(Number(r.expires_in)||300)*1000;
      if(!/^https:\/\//.test(url))throw new Error('Сайт не вернул ссылку на бота');
      say('Нажмите Start в Telegram и вернитесь сюда'+(num?' · номер входа <b>'+num+'</b>':'')+'<br><a href="'+esc(url)+'" target="_blank" rel="noopener">Открыть бота ещё раз</a>',1);
      if(w)w.location.href=url;
      pollLogin(String(r.poll_id),until);
    }catch(x){if(w)w.close();tg.classList.remove('ld');say('Ошибка: '+esc(x.message))}
    finally{vBusy=false}
  };
  vEmailAuth($('#em'),alive);
}
function vEmailAuth(card,alive){
  let working=false,savedEmail='',prevP=0;
  const okMail=(s)=>/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(s);
  const tabs=(m)=>'<div class="vseg" style="--p:'+prevP+'"><i></i><button data-m="login" class="'+(m==='login'?'on':'')+'">'+ic('lock',16)+'Войти</button><button data-m="reg" class="'+(m==='reg'?'on':'')+'">'+ic('user',16)+'Регистрация</button></div>';
  const head=(t,s)=>'<div class="vh"><b>'+t+'</b>'+(s?'<div class="mute small">'+s+'</div>':'')+'</div>';
  const fld=(icn,id,type,ph,ac,val,eye)=>'<div class="vin">'+ic(icn,18)+'<input id="'+id+'" '+(type==='code'?'type="text" inputmode="numeric"':'type="'+type+'"')+' autocomplete="'+ac+'" placeholder="'+ph+'" value="'+esc(val||'')+'">'+(eye?'<button type="button" class="eye" data-eye aria-label="Показать пароль">'+ic('eye',18)+'</button>':'')+'</div>';
  const btn=(t,icn)=>'<button class="vbtn" id="go">'+ic(icn,19)+'<span>'+t+'</span></button><div class="vmsg" id="i"></div>';
  const link=(id,t)=>'<div class="vlk" id="'+id+'">'+t+'</div>';
  function bind(mode){
    card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(!working)render(b.dataset.m)});
    card.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,sh=i.type==='password';i.type=sh?'text':'password';b.innerHTML=ic(sh?'eyeoff':'eye',18)});
    const sg=card.querySelector('.vseg');
    if(sg&&mode){const p=mode==='reg'?1:0;requestAnimationFrame(()=>requestAnimationFrame(()=>sg.style.setProperty('--p',p)));prevP=p}
  }
  function task(info,wait,work,ok){
    if(working)return;working=true;const gb=card.querySelector('#go');gb&&gb.classList.add('ld');info.className='vmsg';info.textContent=wait;
    const done=()=>{working=false;gb&&gb.classList.remove('ld')};
    work().then(()=>{done();if(alive())ok()}).catch((e)=>{done();if(alive()){info.className='vmsg bad';info.textContent=(e&&e.message)||'Не удалось выполнить запрос'}});
  }
  const fail=(info,m)=>{info.className='vmsg bad';info.textContent=m};
  const sent=(info)=>{info.className='vmsg ok';info.textContent='Код отправлен ещё раз'};
  const WAIT='Проверка и отправка кода… это займёт несколько секунд';
  function render(mode,step){
    if(mode==='login'){
      card.innerHTML=tabs('login')+fld('mail','e','email','Почта','email',savedEmail)+fld('lock','p','password','Пароль','current-password','',1)+btn('Войти','bolt')+link('fg','Забыли пароль?');
      bind('login');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(!p)return fail(info,'Введите пароль');
        task(info,'Входим…',()=>VP.loginEmail(e,p),()=>vpnScreen());
      };
      $('#fg',card).onclick=()=>{if(working)return;savedEmail=$('#e',card).value.trim();render('reset')};
    }else if(mode==='reg'&&!step){
      card.innerHTML=tabs('reg')+fld('mail','e','email','Почта','email',savedEmail)+fld('lock','p','password','Придумайте пароль','new-password','',1)+btn('Получить код','send')+'<div class="mute small" style="text-align:center;margin-top:8px">Пришлём код подтверждения на почту</div>';
      bind('reg');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        task(info,WAIT,()=>VP.registerRequest(e,p),()=>render('reg',{pwd:p}));
      };
    }else if(mode==='reg'){
      const pwd=step.pwd;
      card.innerHTML=tabs('reg')+head('Код из письма','Отправили на '+esc(savedEmail))+fld('key','c','code','Код из письма','one-time-code')+btn('Подтвердить','check')+link('rs','Отправить код ещё раз')+link('ch','Изменить почту или пароль');
      bind('reg');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim();if(!c)return fail(info,'Введите код из письма');
        task(info,'Подтверждаем…',()=>VP.registerConfirm(savedEmail,c,pwd),()=>vpnScreen());
      };
      $('#rs',card).onclick=()=>task(info,WAIT,()=>VP.registerRequest(savedEmail,pwd),()=>sent(info));
      $('#ch',card).onclick=()=>{if(!working)render('reg')};
    }else if(mode==='reset'&&!step){
      card.innerHTML=head('Сброс пароля','Пришлём код на почту — по нему можно задать новый пароль')+fld('mail','e','email','Почта','email',savedEmail)+btn('Получить код','send')+link('bk','← Назад ко входу');
      const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim();savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        task(info,WAIT,()=>VP.resetRequest(e),()=>render('reset',{sent:1}));
      };
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }else{
      card.innerHTML=head('Новый пароль','Код отправлен на '+esc(savedEmail))+fld('key','c','code','Код из письма','one-time-code')+fld('lock','p','password','Новый пароль','new-password','',1)+btn('Сменить пароль','check')+link('rs','Отправить код ещё раз')+link('bk','← Назад ко входу');
      bind();const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim(),p=$('#p',card).value;
        if(!c)return fail(info,'Введите код из письма');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        let signed=false;
        task(info,'Меняем пароль…',async()=>{signed=await VP.resetConfirm(savedEmail,c,p)},()=>{
          if(signed)vpnScreen();else{toast('Пароль изменён — войдите с новым');render('login')}
        });
      };
      $('#rs',card).onclick=()=>task(info,'Проверка и отправка кода…',()=>VP.resetRequest(savedEmail),()=>sent(info));
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }
  }
  render('login');
}

// ---------- подписки и покупка ----------
let vTabSel=-1;
function vForm(box,alive,subs,plansAll,prov){
  const methods=(prov.providers||[]).filter(Boolean).map(id=>[id,vProv(id)]);
  const list=plansAll.filter(p=>!p.is_lifetime).sort((a,b)=>(a.days-b.days)||(a.total_price_display-b.total_price_display)); // бессрочные не берём
  const canBuy=list.length>0&&methods.length>0;
  const S={tab:(vTabSel===0||vTabSel===1)?vTabSel:(subs.length>0?0:1),
    plan:list.find(p=>p.is_popular)||list[0]||{},method:methods.length?methods[0][0]:'',quote:null,qTok:0};
  const best=subs.find(s=>s.is_active&&!s.is_frozen)||null,frz=!best&&subs.find(s=>s.is_frozen);
  const hs=best?'ok':frz?'fr':'off';
  box.innerHTML='<div class="vhero vs '+hs+'">'+vShield(hs,best?'shield':frz?'snow':'shieldoff')+'<h3>'+(best?'Защита включена':frz?'Подписка заморожена':'Нет активной подписки')+'</h3><div class="mute small">'+(best?'Кот на страже · осталось '+vDays(best.days_left)+' · до '+vDate(best.end_date):frz?'Кот дремлет. Разморозьте подписку, чтобы снова пользоваться VPN':'Котик скучает. Выберите тариф — ключ появится сразу после оплаты')+'</div></div><div id="pb"></div><div class="vseg" id="sg" style="--p:'+S.tab+'"><i></i><button data-tab="0">'+ic('cat',18)+'Моя подписка</button><button data-tab="1">'+ic('fish',18)+'Купить</button></div><div id="vc"></div>';
  const vc=$('#vc',box);

  // платёж создан, но ещё не подтверждён
  function paintPending(){
    const id=LS.get('vpn_pay'),pb=$('#pb',box);
    if(!id){pb.innerHTML='';return}
    pb.innerHTML='<div class="vpend"><span class="vpc">'+ic('cat',32)+'</span><div style="flex:1"><b>Ждём оплату</b><div class="small mute" id="pw">Подтверждение придёт автоматически</div></div></div><div class="vrow2"><button class="vbtn alt" id="pn">'+ic('renew',18)+'<span>Проверить</span></button><button class="vbtn gh" id="px"><span>Не жду</span></button></div>';
    $('#pn',box).onclick=()=>{$('#pw',box).textContent='Проверяем оплату…';pollPay(id,0,++vPollGen)};
    $('#px',box).onclick=()=>{LS.set('vpn_pay','');vPollGen++;paintPending()};
  }
  function pollPay(id,tries,gp){
    if(!alive()||gp!==vPollGen)return;
    VP.paymentStatus(id).then((j)=>{
      const st=j.status;
      return (j.fulfillment==='done'||statusKind(st)===2)?'done':statusKind(st)===3?'failed':'wait';
    }).catch((e)=>e instanceof VpnAuth?'auth':'wait').then((res)=>{
      if(!alive()||gp!==vPollGen)return;
      const pw=$('#pw',box);
      if(res==='done'){const pk=LS.get('vpn_pk');if(pk)LS.set('ach_'+pk,'1');LS.set('vpn_pk','');LS.set('vpn_pay','');toast('Оплата прошла — подписка готова');vpnScreen()}
      else if(res==='failed'){LS.set('vpn_pay','');toast('Платёж отменён или истёк');vpnScreen()}
      else if(res==='auth')vpnScreen();
      else if(tries>=60){if(pw)pw.textContent='Оплата пока не подтвердилась. Нажмите «Проверить сейчас» после оплаты.'}
      else{if(pw)pw.textContent='Ждём подтверждение оплаты…';setTimeout(()=>pollPay(id,tries+1,gp),4000)}
    });
  }
  // вернулись во вкладку после оплаты — проверяем сразу
  const onVis=()=>{if(document.visibilityState==='visible'&&alive()&&LS.get('vpn_pay'))pollPay(LS.get('vpn_pay'),0,++vPollGen);else if(!alive())document.removeEventListener('visibilitychange',onVis)};
  document.addEventListener('visibilitychange',onVis);

  // создаёт платёж (покупка, продление, трафик, пополнение) и открывает страницу оплаты
  function payWith(note,create,kind){
    if(vBusy)return;
    // окно оплаты открывается прямо в тапе по кнопке «Оплатить», иначе браузер его заблокирует
    if(LS.get('cpay')){confirmSheet('Перейти к оплате?','Страница оплаты откроется в новой вкладке.','Оплатить',()=>payRun(note,create,kind));return}
    return payRun(note,create,kind);
  }
  async function payRun(note,create,kind){
    if(vBusy)return;vBusy=true;
    const w=window.open('about:blank','_blank'); // пока жив тап, иначе окно оплаты заблокируют
    note.hidden=false;note.textContent='Создаём платёж…';
    try{
      const r=await create(),id=r.payment_id||'',url=String(r.invoice_url||'');
      if(id){LS.set('vpn_pay',id);LS.set('vpn_pk',kind||'')}
      if(!/^https:\/\//.test(url)){if(w)w.close();note.textContent='Сайт не вернул ссылку на оплату';return}
      note.innerHTML='Платёж создан. Если страница оплаты не открылась — <a href="'+esc(url)+'" target="_blank" rel="noopener">откройте её здесь</a>.';
      if(w)w.location.href=url;
      if(id){paintPending();pollPay(id,0,++vPollGen)}
    }catch(x){
      if(w)w.close();
      if(x instanceof VpnAuth)return vpnScreen();
      note.textContent='Ошибка: '+x.message;
    }finally{vBusy=false}
  }
  const guard=(fn)=>async(...a)=>{try{await fn(...a)}catch(x){if(x instanceof VpnAuth)vpnScreen();else toast('Ошибка: '+x.message)}};

  // ---------- вкладка «Моя подписка» ----------
  const CIRC=2*Math.PI*30;
  function subCard(s,i){
    const active=!!s.is_active,frozen=!!s.is_frozen,url=String(s.subscription_url||''),lim=Number(s.traffic_limit_bytes)||0,used=Number(s.used_traffic_bytes)||0;
    const name=vPlanName(s.plan_name||'Подписка'),end=vDate(s.end_date),sid=VP.subId(s);
    const col=frozen?'#22C1DC':active?'var(--green)':'var(--mute)',st=frozen?'Заморожена':active?'Активна':'Не активна';
    const dl=Math.max(0,Number(s.days_left)||0),tot=Number(s.days)||Math.max(dl,30),pc=Math.min(1,dl/tot);
    let h='<div class="vc'+(active&&!frozen?' on':'')+'" data-i="'+i+'" style="--d:'+(i*.08)+'s"><div class="vc-h"><div class="vring" style="--rc:'+col+'"><svg viewBox="0 0 74 74" width="74" height="74"><circle class="bg" cx="37" cy="37" r="30"/><circle class="fg" cx="37" cy="37" r="30" style="stroke:'+col+';stroke-dasharray:'+CIRC.toFixed(1)+';stroke-dashoffset:'+CIRC.toFixed(1)+'" data-o="'+(CIRC*(1-pc)).toFixed(1)+'"/></svg><b>'+dl+'<small>'+vDays(dl).split(' ')[1]+'</small></b></div>'
      +'<div class="vc-t"><b>'+esc(name)+'</b><span class="vpill">'+ic('cat',14)+vDevs(s.devices)+'</span><span class="vst" style="--c:'+col+'"><i></i>'+st+' · до '+end+'</span></div></div>';
    if(lim>0){const p2=Math.min(100,Math.round(used/lim*100));h+='<div class="vtr"><div class="vtrh"><span>'+ic('chart',15)+'Трафик</span><b>'+vGb(used)+' из '+vGb(lim)+'</b></div><div class="vtk'+(p2>=90?' hi':'')+'"><div class="vbw"><div class="vbar'+(p2>=90?' hi':'')+'"><i data-w="'+p2+'"></i></div><span class="vrun" data-l="'+p2+'">'+ic('cat',16)+'</span></div><span class="vfish">'+ic('fish',22)+'</span></div></div>'}
    let prim='';if(/^https:\/\//.test(url))prim+='<button class="vbtn" data-act="client">'+ic('bolt',20)+'<span>Подключить</span></button>';if(sid)prim+='<button class="vbtn grn" data-act="renew">'+ic('renew',19)+'<span>Продлить</span></button>';if(prim)h+='<div class="vprim">'+prim+'</div>';
    if(/^https:\/\//.test(url)){
      h+='<div class="vlink">'+ic('paw',17)+(LS.get('vmask')?'<span data-u="'+esc(url)+'" onclick="this.textContent=this.dataset.u">••••••••••• нажмите, чтобы показать</span>':'<span>'+esc(url)+'</span>')+'<button class="vib" data-act="copy" aria-label="Скопировать ссылку">'+ic('copy',19)+'</button><button class="vib" data-act="qr" aria-label="QR-код"><span style="font:700 11px system-ui">QR</span></button></div>';
    }
    const T=(a,icn,t,c)=>'<button class="vt'+(c==='dg'?' dg':'')+'" data-act="'+a+'"'+(c&&c!=='dg'?' style="--c:'+c+'"':'')+'><span class="vti">'+ic(icn,20)+'</span>'+t+'</button>';
    const tl=[];
    if(sid){
      if(!s.is_trial&&!s.is_lifetime)tl.push(T('upg','users','Больше устройств','#8B7CFF'));
      if(lim>0)tl.push(T('traf','fish','Докупить трафик','#FF9A3D'));
      tl.push(T('devs','cat','Мои устройства'));
      tl.push(frozen?T('unfreeze','sun','Разморозить','#FFC233'):T('freeze','snow','Заморозить','#22C1DC'));
      tl.push(T('rot','yarn','Новая ссылка','#F472B6'));
    }
    if(tl.length)h+='<div class="vgrid">'+tl.join('')+'</div>';
    return h+'<div class="small mute vnote" data-note hidden></div><div data-devs hidden></div></div>';
  }
  function fillMine(){
    let h='';
    if(!subs.length)h='<div class="vc vempty"><div class="vemo">'+ic('cat',50)+'</div><b style="font-size:18px">Подписки пока нет</b><div class="mute small">Выберите тариф — ключ появится здесь сразу после оплаты</div><button class="vbtn" data-act="tobuy">'+ic('bag',19)+'<span>Выбрать тариф</span></button></div>';
    else h=subs.map(subCard).join('');
    h+='<div class="vrow2">'+(methods.length?'<button class="vbtn alt" data-act="topup">'+ic('wallet',18)+'<span>Пополнить</span></button>':'')+'<button class="vbtn alt dgt" data-act="out">'+ic('logout',18)+'<span>Выйти</span></button></div><div class="small mute vnote" id="tn" hidden></div>';
    vc.innerHTML=h;vAnim(vc);
  }

  // ---------- вкладка «Купить подписку» ----------
  function paintTotal(){
    const q=S.quote;let minor=-1;
    if(q){const bp=q.provider_totals&&q.provider_totals[S.method];minor=(bp!=null&&bp>=0)?bp:(q.total_display_minor!=null?q.total_display_minor:-1)}
    const t=$('#tot',box);if(t){t.textContent=minor>=0?vRub(minor):'—';t.classList.remove('bump');void t.offsetWidth;if(minor>=0)t.classList.add('bump')}
  }
  function requestQuote(){
    const my=++S.qTok,uuid=S.plan.uuid;S.quote=null;
    const cap=$('#cap',box);if(cap)cap.textContent='К оплате · '+vDays(S.plan.days);
    const t=$('#tot',box);if(t)t.textContent='…';
    VP.quote(uuid).then((r)=>{if(my===S.qTok&&alive()){S.quote=r;paintTotal()}}).catch(()=>{if(my===S.qTok&&alive()){const t2=$('#tot',box);if(t2)t2.textContent='—'}});
  }
  function paintPlans(){
    const dayVals=[...new Set(list.map(p=>p.days))];
    $('#dp',vc).innerHTML=dayVals.map(d=>'<button data-d="'+d+'" class="'+(d===S.plan.days?'on':'')+'">'+vDays(d)+'</button>').join('');
    $('#pl',vc).innerHTML=list.filter(p=>p.days===S.plan.days).map((p,k)=>{
      const bd=p.is_special?'Особый':p.is_popular?'Популярный':'';
      return '<button class="vplan'+(p.uuid===S.plan.uuid?' on':'')+'" data-u="'+esc(p.uuid)+'" style="animation-delay:'+(k*.06)+'s">'+(bd?'<span class="vbd">'+bd+'</span>':'')+'<span class="vn">'+ic('cat',32)+'<em>'+(p.devices|0)+'</em></span><span class="vm"><b>'+esc(vPlanName(p.name))+'</b><span>'+vDevs(p.devices)+'</span></span><span class="vpr">'+vRub(p.total_price_display)+'</span><span class="vck">'+ic('check',13)+'</span></button>'}).join('');
  }
  function fillBuy(){
    if(!canBuy){vc.innerHTML='<div class="vc vempty"><div class="vemo">'+ic('cat',50)+'</div><b style="font-size:18px">Покупка сейчас недоступна</b><div class="mute small">Загляните позже</div></div>';return}
    vc.innerHTML='<div class="vlab" style="margin-top:2px">'+ic('clock',15)+'На какой срок</div><div class="vpills" id="dp"></div><div class="vlab">'+ic('paw',15)+'Тариф</div><div id="pl"></div><div class="vlab" style="margin-top:6px">'+ic('wallet',15)+'Способ оплаты</div><div class="vmeths" id="mt">'+methods.map(m=>'<button data-m="'+esc(m[0])+'" class="'+(m[0]===S.method?'on':'')+'">'+ic('card',16)+esc(m[1])+'</button>').join('')+'</div><div class="vpay"><div style="flex:1;min-width:0"><div class="mute small" id="cap">К оплате</div><div id="tot" class="vtot">—</div></div><button class="vbtn" id="pay">'+ic('paw',20)+'<span>Оплатить</span></button></div><div class="small mute vnote" id="pi" hidden></div>';
    paintPlans();
    $('#dp',vc).onclick=(e)=>{
      const b=e.target.closest('[data-d]');if(!b)return;const d=Number(b.dataset.d),inDays=list.filter(p=>p.days===d);
      S.plan=inDays.find(p=>p.name===S.plan.name)||inDays.find(p=>p.is_popular)||inDays[0];paintPlans();requestQuote();
    };
    $('#pl',vc).onclick=(e)=>{
      const b=e.target.closest('[data-u]');if(!b)return;S.plan=list.find(p=>p.uuid===b.dataset.u)||S.plan;
      vc.querySelectorAll('.vplan').forEach(x=>x.classList.toggle('on',x===b));requestQuote();
    };
    $('#mt',vc).onclick=(e)=>{
      const b=e.target.closest('[data-m]');if(!b)return;S.method=b.dataset.m;
      vc.querySelectorAll('#mt button').forEach(x=>x.classList.toggle('on',x===b));paintTotal();
    };
    $('#pay',vc).onclick=()=>payWith($('#pi',vc),()=>VP.intent(S.plan.uuid,S.method),'buy');
    requestQuote();
  }
  function showTab(){
    const sg=$('#sg',box);sg.style.setProperty('--p',S.tab);
    sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',Number(b.dataset.tab)===S.tab));
    S.tab===0?fillMine():fillBuy();
  }
  box.querySelectorAll('#sg button').forEach(b=>b.onclick=()=>{const t=Number(b.dataset.tab);if(S.tab!==t){S.tab=t;vTabSel=t;showTab()}});

  // ---------- действия ----------
  const pickMethod=(title,cb)=>listSheet(title,methods.map(m=>m[1]),(i)=>cb(methods[i][0]));
  function askTopup(note,prefillMinor){
    const prefill=prefillMinor>0?String(Math.floor((prefillMinor+99)/100)):'';
    inputSheet('Пополнить баланс','сумма, ₽',prefill,(text)=>{
      const rub=parseInt(text,10);
      if(!(rub>=1)){toast('Введите сумму в рублях');return false}
      pickMethod('Способ оплаты',(prov2)=>payWith(note,()=>VP.topup(rub*100,prov2),'topup'));
    });
  }
  function pickRenewDays(sid,note){
    const opts=['1 месяц','7 дней','14 дней','60 дней','90 дней','Свой срок…'],vals=[null,7,14,60,90,-1];
    listSheet('На сколько продлить?',opts,(i)=>{
      if(vals[i]===-1)inputSheet('Свой срок, дней','от 3 до 365','',(t)=>{
        const n=parseInt(t,10);if(!(n>=3&&n<=365)){toast('Введите число от 3 до 365');return false}
        quoteRenew(sid,note,n);
      });
      else quoteRenew(sid,note,vals[i]);
    });
  }
  async function quoteRenew(sid,note,days){
    note.hidden=false;note.textContent='Считаем цену…';
    let q=null;
    try{q=await VP.renewQuote(sid,days)}
    catch(e){if(e instanceof VpnAuth)return vpnScreen()} // цену узнать не вышло — продлить всё равно можно
    note.hidden=true;
    const totals=q&&q.provider_totals;
    const items=methods.map(([id,name])=>{const m=totals&&totals[id];return m!=null&&m>=0?name+' — '+vRub(m):name});
    const end=String((q&&q.new_end_date)||'');
    const title=end.length>=10?'Продлить до '+vDate(end):'Продлить подписку';
    listSheet(title,items,(i)=>payWith(note,()=>VP.renew(sid,methods[i][0],days),'renew'));
  }
  async function startUpgrade(s,sid,note){
    note.hidden=false;note.textContent='Считаем доплату…';
    try{
      const days=s.days,dev=s.devices,cur=s.plan_uuid;
      const plans=await VP.plans();
      const cands=plans.filter(p=>!p.is_lifetime&&p.days===days&&p.devices>dev&&p.uuid!==cur).sort((a,b)=>a.devices-b.devices);
      const ok=[];let lastErr=null;
      for(const p of cands){try{ok.push([p,await VP.upgradeQuote(sid,p.uuid)])}catch(e){if(e instanceof VpnAuth)throw e;lastErr=e}}
      let balance=-1;
      try{balance=(await VP.profile()).balance_display_minor}catch(e){if(e instanceof VpnAuth)throw e}
      if(balance==null)balance=-1;
      note.hidden=true;
      if(!cands.length)return toast('Тарифов с большим числом устройств нет');
      if(!ok.length){note.hidden=false;note.textContent='Не удалось посчитать доплату: '+(lastErr&&lastErr.message);return}
      const items=ok.map(([p,q])=>vPlanName(p.name)+' · '+vDevs(p.devices)+' — доплата '+vRub(q.charged_display_minor));
      listSheet('Больше устройств',items,(i)=>{
        const [p,q]=ok[i],charge=Number(q.charged_display_minor)||0,name=vPlanName(p.name)+' · '+vDevs(p.devices);
        if(q.enough_balance===false){
          const have=balance>=0?'На балансе '+vRub(balance)+'.':'';
          confirmSheet('Не хватает баланса','Нужно '+vRub(charge)+'. '+have+' Пополните баланс и повторите.','Пополнить',()=>{
            const need=balance>=0?charge-balance:charge;askTopup(note,need>0?need:charge);
          });
        }else confirmSheet('Перейти на «'+name+'»?','С баланса спишется '+vRub(charge)+'. Срок подписки не изменится.','Перейти',guard(async()=>{
          if(vBusy)return;vBusy=true;
          try{await VP.upgrade(sid,p.uuid);LS.set('ach_upg','1');toast('Тариф изменён');vpnScreen()}finally{vBusy=false}
        }));
      });
    }catch(e){
      if(e instanceof VpnAuth)return vpnScreen();
      note.hidden=false;note.textContent='Не удалось загрузить тарифы: '+e.message;
    }
  }
  async function loadDevices(card,sid){
    const dv=$('[data-devs]',card);dv.innerHTML='<div class="vdevs"><div class="vsk" style="height:56px;margin:0"></div></div>';
    try{
      const devs=await VP.devices(sid);
      let blocks=[];try{blocks=await VP.deviceBlocks(sid)}catch(e){if(e instanceof VpnAuth)throw e}
      const row=(nm,sub,b)=>'<div class="vdev"><span class="vdi">'+ic('cat',20)+'</span><div style="flex:1;min-width:0"><div class="vdn">'+esc(nm)+'</div><div class="small mute">'+esc(sub)+'</div></div>'+b+'</div>';
      let h='<div class="vdevs"><div class="vlab" style="margin:0 0 4px">'+ic('cat',16)+'Устройства · '+devs.length+'</div>';
      if(!devs.length)h+='<div class="small mute" style="padding:6px 0">Пока ни одно устройство не подключено</div>';
      devs.forEach((d,k)=>{
        const sub=[d.os,d.ip,'был '+vDateTime(d.last_seen)].filter(x=>x&&x!=='null').join(' · ');
        h+=row(d.name||d.model||'Устройство',sub,'<button class="vchip dg" data-dd="'+k+'">Отключить</button>');
      });
      if(blocks.length){h+='<div class="vlab" style="margin:14px 0 4px">'+ic('lock',15)+'Отключённые</div>';blocks.forEach((b,k)=>{h+=row(b.name||'Устройство','отключено '+vDateTime(b.blocked_at),'<button class="vchip" data-du="'+k+'">Вернуть</button>')})}
      dv.innerHTML=h+'</div>';
      dv.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{

const cv=document.createElement('canvas');cv.id='bgc';document.body.prepend(cv);
const cx=cv.getContext('2d');let P=[],raf=0,W=0,H=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function bgSize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function mk(c,init){return{x:rnd(0,W),y:init?rnd(0,H):(c.vy>=0?-24:H+24),s:rnd(c.s[0],c.s[1]),vx:rnd(-1,1)*c.vx+c.vx*.3,vy:c.vy*rnd(.6,1.4),r:rnd(0,6.28),vr:rnd(-.02,.02),a:rnd(.35,.9),ph:rnd(0,6.28),col:c.cols?c.cols[Math.floor(Math.random()*c.cols.length)]:''}}
function bgInit(){
  cancelAnimationFrame(raf);bgSize();cx.clearRect(0,0,W,H);
  const c=BG[TH('skin',0)];if(!c||!TH('anim',ANIM_D))return;
  P=Array.from({length:Math.round(36*[.5,1,1.7][TH('pc',1)])},()=>mk(c,true));loop();
}
function loop(){
  const c=BG[TH('skin',0)];if(!c)return;cx.clearRect(0,0,W,H);cx.textAlign='center';
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.ph+=.03;
    if(p.y>H+30||p.y<-30||p.x<-30||p.x>W+30)Object.assign(p,mk(c,false));
    cx.save();cx.globalAlpha=c.tw?.25+.6*Math.abs(Math.sin(p.ph)):p.a;
    if(c.c){cx.translate(p.x,p.y);cx.rotate(p.r);cx.font=p.s+'px serif';cx.fillText(c.c,0,0)}
    else{cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.s/2,0,6.283);cx.fill()}
    cx.restore();
  }
  raf=requestAnimationFrame(loop);
}

  el.innerHTML=`<div class="lkb"><div style="font-size:40px">🔒</div><b style="font-size:20px">${esc(title)}</b><div class="mute small" style="min-height:18px">${esc(sub||'')}</div>${o.nopad?'':`<div class="lkd"><i></i><i></i><i></i><i></i></div><div class="lkp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>`}${o.bio?'<button class="b" data-x="bio">👆 Разблокировать</button>':''}${o.cancel?'<button class="chip" data-x="no" style="margin:0">Отмена</button>':''}${o.forgot?'<div class="lk" data-x="fg" style="font-size:13px">Забыли доступ?</div>':''}</div>`;
  const done=(r)=>{el.remove();res(r)};
  el.onclick=(e)=>{
    const b=e.target.closest('[data-k],[data-x]');if(!b)return;
    if(b.dataset.x){done(b.dataset.x==='no'?null:b.dataset.x);return}
    const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
    el.querySelectorAll('.lkd i').forEach((d,i)=>d.classList.toggle('f',i<v.length));
    if(v.length===4)setTimeout(()=>done(v),120);
  };
  document.body.appendChild(el);
})}
function lkFail(){try{const a=JSON.parse(LS.get('lkf','[]'));a.push(Date.now());LS.set('lkf',JSON.stringify(a.slice(-20)))}catch(e){}}
function lkForgot(){confirmSheet('Сбросить доступ?','Будут стёрты все данные приложения на этом устройстве: ник, вход в чат и в VPN. Отменить нельзя.','Стереть и сбросить',()=>{try{localStorage.clear()}catch(e){}location.reload()},true)}
async function lockScreen(){
  if(locked||!lockMode())return;locked=true;let sub='',first=true;
  for(;;){
    let ok=false;
    if(lockMode()==='bio'){
      if(first){first=false;ok=await bioGet()}
      if(!ok){
        const r=await askPin('PharmShop заблокирован',sub,{nopad:1,bio:1,forgot:1});
        if(r==='fg'){lkForgot();continue}
        ok=await bioGet();if(!ok){sub='Не удалось подтвердить';lkFail()}
      }
    }else{
      const r=await askPin('Введите PIN',sub,{forgot:1});
      if(r==='fg'){lkForgot();continue}
      ok=await pinOk(r);if(!ok){sub='Неверный PIN';lkFail()}
    }
    if(ok)break;
  }
  locked=false;
  try{const f=JSON.parse(LS.get('lkf','[]'));LS.set('lkf','[]');
    if(f.length&&TH('sf',0))sheetOpen('Неудачные попытки входа','<div class="mute small" style="margin:8px 0">С прошлого входа: '+f.length+'</div>'+f.slice(-5).reverse().map(t=>'<div class="dm"><span>'+new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>').join(''))}catch(e){}
}
async function verifyLock(){
  const m=lockMode();if(!m)return true;if(m==='bio')return bioGet();
  const r=await askPin('Введите PIN','',{cancel:1});if(r==null)return false;
  if(await pinOk(r))return true;toast('Неверный PIN');return false;
}
async function setLock(m){
  const cur=lockMode();if(m===cur)return;
  if(cur&&!await verifyLock())return;
  if(m==='pin'){
    const a=await askPin('Придумайте PIN','4 цифры',{cancel:1});if(a==null)return;
    const b=await askPin('Повторите PIN','',{cancel:1});if(b==null)return;
    if(a!==b){toast('PIN не совпал');return}LS.set('lkh',await pinHash(a));
  }else if(m==='bio'){
    const ok=window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
    if(!ok){toast('На этом устройстве отпечаток недоступен');return}
    try{await bioReg()}catch(e){toast('Не удалось настроить отпечаток');return}
  }
  LS.set('lock',m);if(!m)LS.set('pinvpn','');sbRender();
}

function vpnNotes(subs){

    trafSnap(a);
    a.forEach((s)=>{
      if(s.is_active){LS.set('ach_sub','1');if((Number(s.devices)||0)>=3)LS.set('ach_dev3','1');if((Number(s.days_left)||0)>=90)LS.set('ach_long','1')}const ub=Number(s.used_traffic_bytes)||0;if(ub>=10*1073741824)LS.set('ach_gb','1');if(ub>=100*1073741824)LS.set('ach_gb100','1');
      const id=VP.subId(s),end=String(s.end_date||'');
      if(TH('nv',1)&&s.is_active){const d=Number(s.days_left);

  }catch(e){}
}

async function bgPoll(){

    const r=await api('/api/chat/poll',{}),last=Number(LS.get('nsup','-1'));

let AC=null;const sndAt={};
function snd(k){
  if(!TH('snd',0))return;
  if(k==='ui'&&!TH('sndt',1))return;if((k==='msg'||k==='send')&&!TH('sndc',1))return;
  const n=Date.now();if(sndAt[k]&&n-sndAt[k]<(k==='ui'?40:250))return;sndAt[k]=n;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const vol=[.05,.12,.25][TH('sv',1)],t0=AC.currentTime;
    const seq={ui:[[900,0,.03]],on:[[660,0,.07],[990,.07,.09]],off:[[760,0,.07],[500,.07,.09]],msg:[[784,0,.09],[1175,.09,.14]],send:[[520,0,.06],[700,.06,.08]]}[k]||[];
    seq.forEach(([f,d,l])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(vol,t0+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+l);o.start(t0+d);o.stop(t0+d+l+.02)});
  }catch(e){}
}
