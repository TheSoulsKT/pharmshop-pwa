<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PharmShop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PharmShop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#121214;--card:#1d1c21;--line:#2b2a31;--text:#f2f2f4;--mute:#9a9da3;--blue:#3b8ef3;--red:#ff5a52;--green:#34c759;--acc:#ffb020;--a1:#ffc83d;--a2:#ff8a3d;--on:#231400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px);position:relative;z-index:1}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
h1{font-size:26px;margin:6px 0 14px}.mute{color:var(--mute);font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .42s cubic-bezier(.1,.7,.2,1) both;animation-delay:calc(min(var(--i),10)*55ms)}
.press{transition:transform .24s cubic-bezier(.3,1.9,.5,1)}.press:active{transform:scale(.97);transition:transform .11s ease-out}
button{font:inherit;cursor:pointer}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 10px;color:var(--text);min-height:96px}
.card b{display:block;font-size:18px}
.ib{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ib svg,.bn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.hd h1{margin:0;font-size:24px}
.ny{border-radius:18px;padding:16px 18px;margin:0 0 14px;background:linear-gradient(90deg,#c62f3e,#1f7a4d)}
.ny b{display:block;font-size:17px}.ny span{font-size:13px;color:#e8f5ec}
.bn{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px 18px;margin:0 0 16px;background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--on)}
.bn .ib{background:rgba(255,255,255,.22)}.bn b{font-size:20px;display:block}.bn span{font-size:13px;opacity:.8}
.bot{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;padding:16px;margin:4px 0 14px;color:#000;text-align:left;background:linear-gradient(90deg,#7cc4ff,#3b8ef3)}
.bot b{display:block;font-size:20px}.bot span{font-size:13px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-weight:700;font-size:17px;color:var(--on);background:linear-gradient(90deg,var(--a1),var(--a2));margin:8px 0}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.5}
input{width:100%;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:14px;color:var(--text);font-size:17px;margin:6px 0;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:8px 14px}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;color:var(--text)}
.opt i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--mute)}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--card))}
@keyframes dot{from{transform:scale(.5)}to{transform:scale(1)}}
.opt.on i{background:var(--acc);border-color:var(--acc);animation:dot .32s cubic-bezier(.3,2.4,.5,1)}
.total{font-size:19px;color:var(--acc);font-weight:700;margin:14px 0}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}.total.pop{animation:pop .28s cubic-bezier(.3,2,.5,1);transform-origin:left}
.back{background:none;border:0;color:var(--blue);font-size:17px;padding:4px 0 8px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap;word-break:break-word;animation:rise .3s both}
.msg.me{background:var(--blue);margin-left:auto}.msg.ad{background:var(--card);border:1px solid var(--line)}
#log{min-height:50vh}.st{font-size:13px;padding:2px 8px;border-radius:10px;background:var(--line)}.ok{color:var(--green)}.bad{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- адреса: прокси /sf на вашем Cloudflare Worker (см. README) ----
const CH='https://flat-violet-e617pharmshop-chat.soulszlord.workers.dev', SF=CH+'/sf/api/storefront';
const BOT='https://t.me/pharmaishop_bot', VER='pwa-1.0';
const $app=document.getElementById('app'), ls=localStorage;
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){x.startsWith('on')?e[x]=a[x]:x==='class'?e.className=a[x]:e.setAttribute(x,a[x])}e.append(...k.flat().filter(v=>v!=null&&v!==false));return e};
const J=(k,d)=>{try{return JSON.parse(ls[k])??d}catch{return d}}, S=(k,v)=>{ls[k]=JSON.stringify(v)};
const dev=ls.dev||(ls.dev=crypto.randomUUID()), sec=ls.sec||(ls.sec=crypto.randomUUID()+crypto.randomUUID());
let timer=null;
const IC={star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',crown:'M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z',gift:'M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7C10 3 6 4 8 7M12 7c2-4 6-3 4 0',send:'M21 3L3 11l7 2.5L13 21zM10 13.5L21 3',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6',chat:'M4 5h16v11H9l-5 4z',bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'};
const ico=n=>{const d=document.createElement('div');d.innerHTML='<svg viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>';return d.firstChild};
const ib=(n,bg,fg)=>{const e=h('div',{class:'ib',style:'background:'+bg+';color:'+fg},ico(n));return e};
const theme=(a1,a2,on,acc)=>{const st=$app.style;st.setProperty('--a1',a1);st.setProperty('--a2',a2);st.setProperty('--on',on);st.setProperty('--acc',acc)};
const banner=(n,t,sub)=>h('div',{class:'bn'},ib(n,'rgba(255,255,255,.22)','currentColor'),h('div',{},h('b',{},t),h('span',{},sub)));
const popText=(el,t)=>{if(el.textContent===t)return;el.textContent=t;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};
// снегопад
(()=>{const c=h('canvas',{id:'snow'});document.body.append(c);const x=c.getContext('2d');let W,H,f=[];
  const sz=()=>{W=c.width=innerWidth;H=c.height=innerHeight};sz();addEventListener('resize',sz);
  const mk=any=>{const r=1.5+Math.random()*2.5;return{x:Math.random()*W,y:any?Math.random()*H:-r*2,r,v:28+r*9,d:6+Math.random()*14,p:Math.random()*6.28,a:.43+Math.random()*.43}};
  for(let i=0;i<45;i++)f.push(mk(1));let t0=0;
  const fr=t=>{const dt=Math.min((t-t0)/1000,.05);t0=t;x.clearRect(0,0,W,H);
    for(const s of f){s.y+=s.v*dt;s.p+=dt;s.x+=Math.sin(s.p)*s.d*dt;if(s.y>H+10)Object.assign(s,mk(0));x.globalAlpha=s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}
    requestAnimationFrame(fr)};requestAnimationFrame(fr)})();

async function req(url,method='GET',body,hd={}){
  const r=await fetch(url,{method,headers:{'content-type':'application/json',...hd},body:body?JSON.stringify(body):undefined});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{const e=Error('Сервер ответил не JSON (код '+r.status+')');e.status=r.status;e.raw=t.slice(0,300);throw e}
  if(!r.ok){const e=Error(j.error||j.message||'Ошибка '+r.status);e.status=r.status;e.raw=t.slice(0,300);throw e}return j}
const sf=(m,p,b,hd)=>req(SF+p,m,b,hd), chat=(p,b)=>req(CH+'/api/chat/'+p,'POST',b);
let cfg=null;const config=async()=>cfg||(cfg=await sf('GET','/config'));
const ext=u=>window.open(u,'_blank');
function show(...k){clearInterval(timer);theme('#ffc83d','#ff8a3d','#231400','#ffb020');$app.replaceChildren(...k);scrollTo(0,0);$app.classList.remove('rise');[...$app.children].forEach((c,i)=>c.style.setProperty('--i',i));void $app.offsetWidth;$app.classList.add('rise')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b)b.classList.add('press')},true);
const back=()=>h('button',{class:'back',onclick:home},'‹ Назад');

// ---- статусы заказов ----
const kind=s=>{s=(s||'').toLowerCase();if(!s)return 4;
  if(/^(completed|complete|done|delivered|success|succeeded|fulfilled|finished|sent)$/.test(s)||/complet|success|fulfil|finish/.test(s))return 2;
  if(/cancel|fail|expire|refund|reject|error/.test(s))return 3;
  if(/paid|process|progress|deliver|confirm|send|queue|work/.test(s))return 1;return 0};
const eff=o=>{let best='',r=-1;for(const f of['status','order_status','state','payment_status','delivery_status','fulfillment_status']){
  const v=String(o[f]??'');const k=kind(v),rk={2:4,3:3,1:2,0:1}[k]??0;if(v&&rk>r){r=rk;best=v}}
  if(r<4&&(o.completed_at||o.delivered_at||o.fulfilled_at))return'completed';return best};
const label=o=>({2:'выполнен ✓',3:'отменён',1:'в работе',0:'ожидает оплаты'})[kind(eff(o))]||eff(o)||'—';

// ---- главная ----
function home(){
  const c=(n,bg,fg,t,sub,fn)=>h('button',{class:'card',onclick:fn},ib(n,bg,fg),h('div',{},h('b',{},t),h('span',{class:'mute'},sub)));
  show(h('div',{class:'hd'},ib('star','linear-gradient(135deg,#ffc83d,#ff8a3d)','#231400'),h('div',{},h('h1',{},'PharmShop'),h('div',{class:'mute',style:'font-size:12px'},'Telegram магазин • Stars • Premium'))),
    h('div',{class:'ny'},h('b',{},'🎄 С наступающим Новым годом!'),h('span',{},'Пусть в новом году будет больше звёзд ⭐')),
    c('star','#3a2a0a','#ffb020','Звёзды','Telegram Stars, доставка за секунды',()=>buy('stars')),
    c('crown','#2a1a4d','#b794f6','Купить Premium','Покупка подписки',()=>buy('premium')),
    c('bill','#10303a','#22c1dc','Мои заказы','Статусы и оплата',orders),
    c('chat','#12301f','#34c759','Поддержка','Чат с администратором',support),
    h('button',{class:'bot',onclick:()=>ext(BOT)},ib('send','rgba(0,0,0,.12)','#000'),h('div',{},h('span',{},'Заказать в боте'),h('b',{},'@pharmaishop_bot'))),
    h('div',{class:'mute',style:'text-align:center;font-size:12px'},'Цены на услуги могут меняться в зависимости от курса'));
}

// ---- капча (hCaptcha, невидимая) ----
let hcLoad=null;
function captcha(key){
  hcLoad=hcLoad||new Promise((ok,no)=>{const s=h('script',{src:'https://js.hcaptcha.com/1/api.js?render=explicit&host=pharmshop.tgstars.tg',async:''});s.onload=ok;s.onerror=()=>no(Error('Не загрузилась капча'));document.head.append(s)});
  return hcLoad.then(()=>new Promise((res,rej)=>{
    const slot=h('div',{style:'display:flex;justify-content:center;min-height:80px'});
    const ov=h('div',{style:'position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px'},
      h('div',{style:'background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;width:100%'},
        h('b',{},'Подтвердите, что вы человек'),h('div',{style:'height:10px'}),slot,
        h('button',{class:'btn alt',onclick:()=>{ov.remove();rej(Error('Капча закрыта'))}},'Отмена')));
    document.body.append(ov);
    hcaptcha.render(slot,{sitekey:key,theme:'dark',callback:t=>{ov.remove();res(t)},'error-callback':e=>{ov.remove();rej(Error('Капча: '+e))},'expired-callback':()=>{}});
  }))}

// ---- покупка звёзд / Premium ----
async function buy(product){
  const prem=product==='premium';
  show(back(),h('p',{class:'mute'},'Загружаем…'));
  let c;try{c=await config()}catch(e){return show(back(),h('p',{class:'bad'},'Не удалось загрузить: '+e.message))}
  let qty=0,method='',total=h('div',{class:'total'},'К оплате: —'),msg=h('p',{class:'mute'});
  const user=h('input',{placeholder:'Имя в Telegram, без @',autocapitalize:'off',autocorrect:'off',value:ls.lastUser||''});
  const q=h('input',{placeholder:'Сколько звёзд',inputmode:'numeric'});
  let tm=0;
  const quote=()=>{clearTimeout(tm);if(!qty||(!prem&&(qty<(c.min||50)||qty>(c.max||10000)))||!method){popText(total,'К оплате: —');return}
    tm=setTimeout(async()=>{try{const r=await sf('POST','/quote',{quantity:qty,method_id:method,...(prem?{product:'premium'}:{})});popText(total,'К оплате: '+r.total+' '+(r.currency||'RUB'))}catch{total.textContent='Не удалось рассчитать цену'}},400)};
  const chips=h('div',{class:'chips'});
  if(prem){(c.premium||[]).filter(p=>p.available!==false).forEach(p=>{const b=h('button',{class:'chip',onclick:()=>{qty=p.months;[...chips.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');quote()}},p.months+' мес. · '+p.total+' ₽');chips.append(b)});if(chips.firstChild)chips.firstChild.click()}
  else{(c.presets||[]).forEach(v=>chips.append(h('button',{class:'chip',onclick:()=>{q.value=qty=v;quote()}},String(v))));
    q.oninput=()=>{qty=parseInt(q.value)||0;quote()}}
  const ton=/(^|[^a-z])ton([^a-z]|$)|тон/i, ms=(c.methods||[]).filter(m=>!ton.test(m.name||'')&&!ton.test(m.id||''));
  if(ms.length>1)[ms[0],ms[1]]=[ms[1],ms[0]];   // как в приложении: СБП 1 первым
  const mbox=h('div');
  ms.forEach(m=>{const b=h('button',{class:'opt',onclick:()=>{method=m.id;[...mbox.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');quote()}},h('i'),m.name);mbox.append(b)});
  if(mbox.firstChild)mbox.firstChild.click();
  const dbg=h('pre',{class:'mute',style:'white-space:pre-wrap;word-break:break-all;font-size:12px'});
  const pay=h('button',{class:'btn',onclick:async()=>{
    const u=user.value.trim().replace(/^@/,'');
    if(!/^[A-Za-z0-9_]{4,32}$/.test(u))return msg.textContent='Введите имя пользователя Telegram';
    if(!qty||!method)return msg.textContent='Выберите количество и способ оплаты';
    pay.disabled=true;msg.className='mute';msg.textContent='Подтвердите, что вы человек…';dbg.textContent='';ls.lastUser=u;
    try{
      const tok=await captcha(c.hcaptcha_sitekey);
      dbg.textContent='hCaptcha выдал токен, длина '+tok.length+'. Создаём заказ…';
      const r=await sf('POST','/orders',{username:u,quantity:qty,method_id:method,captcha_token:tok,...(prem?{product:'premium'}:{})},{'Idempotency-Key':crypto.randomUUID()});
      const o={...(r.order||r.data||r),username:u,quantity:qty,product:prem?'premium':'stars',ts:Date.now()};
      const l=J('orders',[]);l.unshift(o);S('orders',l.slice(0,50));
      if(o.payment_url)ext(o.payment_url);orders();
    }catch(e){msg.className='bad';msg.textContent=e.message;pay.disabled=false;
      dbg.textContent+='\nДиагностика: '+(e.status?'HTTP '+e.status+' · ':'')+(e.raw||'')+'\nДомен страницы: '+location.hostname}}},'Оплатить');
  const bot=h('button',{class:'btn alt',onclick:()=>ext(BOT)},'Заказать в боте');
  const site=h('button',{class:'btn alt',onclick:()=>ext('https://pharmshop.tgstars.tg/')},'Оформить на сайте');
  show(back(),banner(prem?'crown':'star',prem?'Telegram Premium':'Telegram Stars',prem?'Выберите срок и оплатите':'Доставка в течение 15 секунд'),
    h('p',{class:'mute'},prem?'Подписка для любого @username':(c.stars_rate+' ₽ за звезду · от '+(c.min||50)+' до '+(c.max||10000)+' шт.')),
    user,prem?null:q,chips,h('b',{style:'color:var(--acc)'},'Способ оплаты'),mbox,total,pay,msg,dbg,site,bot);
  if(prem)theme('#8b5cf6','#ec4899','#fff','#b794f6');
}

// ---- заказы ----
async function refresh(o){
  const e=encodeURIComponent(o.access_token||'');
  const tries=[[`/orders/${o.id}?access_token=${e}&token=${e}`,{}],[`/orders/${o.id}`,{'X-Access-Token':o.access_token,'X-Order-Token':o.access_token}],[`/orders/${o.id}`,{Authorization:'Bearer '+o.access_token}]];
  for(const[p,hd]of tries){try{const r=await sf('GET',p,null,hd);Object.assign(o,r.order||r.data||r);return true}catch{}}return false}
function orders(){
  const l=J('orders',[]),box=h('div');
  const draw=()=>box.replaceChildren(...(l.length?l.map(o=>h('div',{class:'card'},
    h('b',{},(o.product==='premium'?'Premium · '+o.quantity+' мес.':o.quantity+' ★')+' → @'+o.username),
    h('div',{class:'mute'},'№ '+(o.order_number||String(o.id||'').slice(0,8))+' · ',h('span',{class:'st '+(kind(eff(o))===2?'ok':kind(eff(o))===3?'bad':'')},label(o))),
    kind(eff(o))<2&&o.payment_url?h('button',{class:'btn',onclick:()=>ext(o.payment_url)},'Оплатить'):null)):[h('p',{class:'mute'},'Заказов пока нет')]));
  show(back(),h('h1',{},'Мои заказы'),box);draw();
  (async()=>{for(const o of l.filter(o=>o.id&&kind(eff(o))<2).slice(0,10))await refresh(o);S('orders',l);draw()})();
}

// ---- поддержка ----
function support(){
  const log=h('div',{id:'log'}),inp=h('input',{placeholder:'Сообщение…',style:'border-color:var(--line)'});
  let last=0,started=!!ls.chat;
  const add=m=>{if(m.id&&m.id<=last)return;last=Math.max(last,m.id||0);log.append(h('div',{class:'msg '+(m.sender==='admin'?'ad':'me')},m.text||'📷 Фото'));scrollTo(0,document.body.scrollHeight)};
  const load=async()=>{if(!started)return;try{const r=await chat('messages',{device:dev,secret:sec,after:last});(r.messages||[]).forEach(add)}catch{}};
  const send=async()=>{const t=inp.value.trim();if(!t)return;inp.value='';
    try{await chat('send',{device:dev,secret:sec,nick:ls.lastUser||'',order:(J('orders',[])[0]||{}).order_number||'',version:VER,text:t,info:navigator.userAgent});started=true;ls.chat='1';load()}
    catch(e){log.append(h('div',{class:'msg ad bad'},'Не отправлено: '+e.message))}};
  inp.onkeydown=e=>{if(e.key==='Enter')send()};
  show(back(),h('h1',{},'Поддержка'),log,inp,h('button',{class:'btn',onclick:send},'Отправить'));
  load();timer=setInterval(load,6000);
}
home();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
