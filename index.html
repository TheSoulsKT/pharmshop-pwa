<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PharmShop</title>
<style>
:root{--bg:#121214;--card:#1D1C21;--line:#2B2A31;--text:#F2F2F4;--mute:#9A9DA3;--blue:#3B8EF3;--on:#000;--green:#34C759;--red:#FF5A5F;--k:1;--ts:1}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:calc(15px*var(--ts))/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:12px 14px 0}

nav button.on{color:var(--blue);font-weight:700}
.wr{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.wr button.chip{margin:0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}.dot.on{border-color:var(--text)}
button.b.dg{color:#fff}
h2{margin:0 0 10px;font-size:20px}.mute{color:var(--mute)}.small{font-size:12px}.err{color:var(--red);min-height:18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:12px 14px;margin-bottom:12px}
input,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(14px*var(--k));padding:11px 14px;font:inherit}
button.b{background:var(--blue);color:var(--on);border:0;border-radius:calc(14px*var(--k));padding:11px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px}
button.chip{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(18px*var(--k));padding:7px 14px;font:inherit;margin-right:6px}
button.chip.on{border-color:var(--blue);color:var(--blue)}
.lw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 2px 12px;display:flex;flex-direction:column}
#list>*{flex:none}
#list>.mute:only-child{margin:auto;text-align:center;padding:0 24px;line-height:1.5}
#list>.mute:only-child::before{content:"💬";display:block;font-size:38px;margin-bottom:8px}
.dsep{align-self:center;margin:14px 0 6px;padding:3px 12px;font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px}
.mr{display:flex;align-items:flex-start;gap:8px;margin-top:9px;max-width:100%}
.mr.cont{margin-top:2px}.mr.me{justify-content:flex-end}
.mr.new{animation:mpop .24s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:bottom left}.mr.me.new{transform-origin:bottom right}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.94)}}
@media (prefers-reduced-motion:reduce){.mr.new{animation:none}}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background-size:cover;background-position:center;cursor:pointer;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.avs{width:32px;flex:none}
.m{--r:calc(18px*var(--k));--r2:6px;position:relative;width:fit-content;max-width:min(84%,560px);min-width:0;margin:0;padding:8px 12px 7px;border-radius:var(--r) var(--r) var(--r) var(--r2);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.14);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.38;-webkit-touch-callout:none}
.m.ct{border-top-left-radius:var(--r2)}
.m.me{border-radius:var(--r) var(--r) var(--r2) var(--r);background:var(--blue);background:linear-gradient(160deg,var(--blue),color-mix(in srgb,var(--blue) 80%,#fff));color:var(--on);border-color:transparent;box-shadow:0 2px 8px color-mix(in srgb,var(--blue) 28%,transparent)}
.m.me.ct{border-top-left-radius:var(--r);border-top-right-radius:var(--r2)}
.m .n{font-size:12.5px;font-weight:700;display:block;margin-bottom:1px;cursor:pointer}
.m .t{float:right;margin:7px -2px -3px 10px;font-size:10.5px;line-height:1;opacity:.6;white-space:nowrap;user-select:none}
.m .tk{font-weight:700;letter-spacing:-2px;margin-left:2px}
.m a{color:var(--blue);text-decoration:underline;text-underline-offset:2px;word-break:break-all}.m.me a{color:inherit}
.crown{width:14px;height:14px;vertical-align:-2px;margin-left:4px}
.row{display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px}
.row textarea{flex:1;resize:none;min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.35;overflow-y:auto;transition:border-color .15s,box-shadow .15s}
.row textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:var(--on);display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 3px 10px color-mix(in srgb,var(--blue) 35%,transparent);transition:transform .15s,opacity .15s}
#send svg{width:21px;height:21px;margin-left:2px}
#send:active{transform:scale(.9)}#send.empty{opacity:.5;box-shadow:none}
#send.cd{background:var(--card);color:var(--text);border:1px solid var(--line);font-size:15px;font-weight:700;box-shadow:none}
#tobot{position:absolute;right:6px;bottom:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
#tobot.on{opacity:1;pointer-events:auto;transform:none}
#tobot b{position:absolute;top:-7px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--blue);color:var(--on);font-size:11px;display:none;align-items:center;justify-content:center;padding:0 5px}
#tobot b.on{display:flex}
[hidden]{display:none!important}
#att{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
#att:active{transform:scale(.92)}
#prev{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#prev img{width:54px;height:54px;object-fit:cover;border-radius:10px}#prev span{flex:1;font-size:13px;color:var(--mute)}
#prev button{width:32px;height:32px;border-radius:50%;border:0;background:var(--line);color:var(--text);padding:0;font-size:15px}
.ph{margin:-1px 0 5px;border-radius:12px;overflow:hidden;line-height:0}
.ph:not(.ok){width:min(230px,58vw);height:150px;background:linear-gradient(100deg,var(--line) 30%,color-mix(in srgb,var(--line) 55%,var(--card)) 50%,var(--line) 70%);background-size:200% 100%;animation:shim 1.3s linear infinite;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;line-height:1.3}
@keyframes shim{to{background-position:-200% 0}}
.ph img{display:block;max-width:min(260px,64vw);max-height:320px;width:auto;height:auto;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;animation:vfade .2s both}
.lb img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.vf{color:var(--blue);font-size:11px}
.stp{display:flex;align-items:center;gap:8px;padding:7px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:13px}
.stp i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}.stp i.y{background:#FFC233}.stp i.g{background:var(--green)}
.stc{padding:12px 14px;margin-bottom:8px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--green) 12%,var(--card)),var(--card));border-radius:16px;animation:vfade .3s both}
.stc .stt{font-weight:700;margin-bottom:2px}
.stars{display:flex;gap:0;margin:4px 0 2px}.sb{background:none;border:0;font-size:32px;line-height:1;padding:2px 4px 2px 0;color:color-mix(in srgb,var(--mute) 45%,transparent);transition:transform .12s,color .12s}.sb.on{color:#FFC233}.sb:active{transform:scale(1.2)}
.stc textarea{margin-top:6px;min-height:64px;border-radius:12px;font-size:16px}
.stc .lnk{background:none;border:0;color:var(--blue);padding:0;font:inherit;font-size:13px}
.dm{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
.vp{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;border-radius:calc(12px*var(--k));padding:11px 0;color:var(--text);font:inherit;font-weight:600}
.seg button.on{background:var(--blue);color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gb{background:none;border:1px solid var(--line);border-radius:calc(12px*var(--k));color:var(--text);padding:12px 8px;font:inherit;font-size:14px;min-height:46px}
.gb.pr{background:var(--blue);border-color:var(--blue);color:var(--on);font-weight:600}
.lnk{font-size:12px;color:var(--mute);word-break:break-all;-webkit-user-select:all;user-select:all;margin-bottom:8px}
select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:calc(14px*var(--k));padding:12px 14px;font:inherit;margin:4px 0 10px}
.paybar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:12px 14px;margin-top:6px}
.lk{color:var(--blue);padding:8px 0;font-size:14px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:50}
.sh{width:100%;max-height:80%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh .it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:14px 4px;font:inherit}
button.b.ghost{background:none;color:var(--mute)}button.b.dg{background:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:calc(14px*var(--k));z-index:60;max-width:88%;font-size:14px;text-align:center}
.pf-top,.pf-hero,.pf-tiles,.pf-h,.pf-ach{flex:none}
.pf-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.pf-top h2{margin:0}
.pf-hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:calc(28px*var(--k));margin-bottom:14px;text-align:center;padding-bottom:20px}
.pf-ban{position:relative;height:124px;overflow:hidden;background:var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 62%,var(--bg)),color-mix(in srgb,var(--blue) 14%,var(--card)))}
.pf-ban:before,.pf-ban:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.pf-ban:before{width:190px;height:190px;right:-50px;top:-80px}.pf-ban:after{width:120px;height:120px;left:-30px;bottom:-70px}
.pf-b{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;animation:pfl 5s ease-in-out infinite}
@keyframes pfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.pf-b{animation:none}}
.pf-avw{position:relative;width:108px;height:108px;margin:-54px auto 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pf-av{width:108px;height:108px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 3px var(--blue);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;overflow:hidden;background:var(--line)}
.pf-cam{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--blue);border:3px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:15px}
.pf-nick{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:0 14px}
.pf-nick b{font-size:calc(24px*var(--ts));word-break:break-all}
.pf-ed{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card));color:var(--text);padding:0;font-size:15px;flex:none}
.pf-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;padding:0 14px}
.pf-chip{background:color-mix(in srgb,var(--blue) 12%,var(--bg));border-radius:20px;padding:7px 14px;font-size:13px}
.pf-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pf-t{border-radius:calc(22px*var(--k));padding:14px 8px;text-align:center;border:1px solid var(--line)}
.pf-t i{font-style:normal;font-size:26px;display:block}.pf-t b{display:block;font-size:calc(21px*var(--ts));margin-top:4px}.pf-t span{font-size:12px;color:var(--mute)}
.pf-t.a{background:color-mix(in srgb,var(--blue) 16%,var(--card));border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.pf-t.g{background:color-mix(in srgb,var(--green) 14%,var(--card));border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.pf-h{margin:4px 0 10px;font-size:19px;font-weight:700}
.pf-ach{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin:0 -14px 6px;padding-left:14px;padding-right:14px;scroll-snap-type:x proximity;scroll-padding:0 14px;scrollbar-width:none}.pf-ach::-webkit-scrollbar{display:none}
.pf-c{flex:none;width:112px;scroll-snap-align:start;border-radius:calc(22px*var(--k));padding:14px 6px 12px;text-align:center;border:1px solid var(--line);background:var(--card);opacity:.55}
.pf-c.on{opacity:1;background:color-mix(in srgb,var(--green) 12%,var(--card));border-color:color-mix(in srgb,var(--green) 50%,var(--line))}
.pf-c i{font-style:normal;font-size:34px;display:block;margin-bottom:6px}.pf-c b{font-size:14px;display:block}.pf-c span{font-size:12px;color:var(--mute)}.pf-c.on span{color:var(--green)}

#bgc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.fi{animation:fi .28s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{font-size:calc(20px*var(--ts));font-weight:700;margin:18px 2px 10px}
.sw-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}.sw-r.dis{opacity:.5}.sw-r>div{flex:1;min-width:0}
.sw{flex:none;position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);padding:0;transition:background .2s}
.sw:before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.sw.on{background:color-mix(in srgb,var(--blue) 45%,var(--line))}.sw.on:before{transform:translateX(18px);background:var(--blue)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{position:relative;text-align:left;border:1px solid var(--line);border-radius:calc(18px*var(--k));padding:12px;font:inherit;display:flex;flex-direction:column;gap:6px}
.sk i{font-style:normal;font-size:28px}.sk b{font-size:16px}.sk .dts{display:flex;gap:6px}.sk .dts span{width:20px;height:20px;border-radius:50%;border:1px solid rgba(128,128,128,.3)}
.sk.on{border:2px solid var(--blue);padding:11px}.sk em{position:absolute;right:12px;top:10px;font-style:normal;color:var(--blue);font-size:20px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--bg);border:1px solid var(--line);border-radius:calc(16px*var(--k));padding:10px 4px;color:var(--mute);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cat.on{color:var(--text);font-weight:700;border-color:var(--blue)}.cat svg{width:64px;height:64px;border-radius:50%}
.ob{display:flex;margin-top:12px}.ob>div{flex:1;text-align:center;font-size:13px}
.obr{display:flex;align-items:center;margin-bottom:6px}.obr i{flex:1;height:3px;background:var(--line)}.obr i.g{background:var(--green)}.obr i.x{background:transparent}
.od{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none}
.od.g{background:var(--green)}.od.a{background:color-mix(in srgb,var(--blue) 40%,var(--bg));border:2px solid var(--blue)}
.lko{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lkb{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:320px;text-align:center}
.lkd{display:flex;gap:14px;margin:6px 0}.lkd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.lkd i.f{background:var(--blue);border-color:var(--blue)}
.lkp{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}.lkp button,.lkp span{height:60px}
.lkp button{border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:22px;font-weight:600}
.sw:disabled{opacity:.6}
body.cc .card{padding:8px 12px;margin-bottom:8px}body.cc .sw-r{padding:6px 0}
body.nb .pf-ban{display:none}body.nb .pf-avw{margin-top:18px}

.pf-av{position:relative;z-index:1;box-shadow:0 0 0 3px var(--card)}.pf-cam{z-index:2}
.pf-avw:before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--green),#EC4899,#E0A030,var(--blue));animation:spin 7s linear infinite}

.pf-lv{flex:none;background:var(--card);border:1px solid var(--line);border-radius:calc(22px*var(--k));padding:14px;margin-bottom:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:fi .5s both}
.pf-lvh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pf-lvi{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--blue) 18%,var(--bg));animation:pfl 4s ease-in-out infinite}
.pf-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pf-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--green),var(--blue));background-size:200% 100%;transition:width 1.1s cubic-bezier(.2,.8,.2,1);animation:shine 3s linear infinite}

.pf-t{animation:fi .5s both}.pf-t:nth-child(2){animation-delay:.08s}
.pf-c{animation:pop .5s both;animation-delay:calc(var(--i,0)*70ms)}@keyframes pop{from{transform:scale(.8) translateY(10px)}to{transform:none}}
.bst{position:fixed;z-index:70;pointer-events:none;font-size:20px;animation:bst .9s ease-out forwards}
@keyframes bst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(120deg);opacity:0}}
body.noanim .pf-avw:before,body.noanim .pf-lvi,body.noanim .pf-bar i,body.noanim .pf-c,body.noanim .pf-t,body.noanim .pf-lv{animation:none}

async function shrinkImg(file){

    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});

      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));

  }
  const vis=()=>{
    if(g!==gen){document.removeEventListener('visibilitychange',vis);return}
    if(!document.hidden&&paused){paused=false;idle=0;clearTimeout(timer);poll()}
  };

  function tick(){
    if(g!==gen)return;const left=nextAt-Date.now();
    if(left>0&&cool()){send.className='cd';send.textContent=Math.ceil(left/1000);setTimeout(tick,250)}else{send.innerHTML=SEND_SVG;send.className='';btn()}
  }
  async function doSend(){
    if(sending)return;
    const left=nextAt-Date.now();
    if(left>0&&cool()){e.textContent='Следующее сообщение через '+Math.ceil(left/1000)+' с';return}
    const text=f.value.trim();if(!text&&!pending)return;
    const img=pending;f.value='';pending='';showPrev();grow();f.focus();stick=true;idle=0;sending=true;send.style.opacity='.6';
    if(cool()){nextAt=Date.now()+COOLDOWN;LS.set('nextAt',nextAt);tick()}

    catch(x){sending=false;send.style.opacity='';stick=false;f.value=text;pending=img;showPrev();grow();if(!x.maint)e.textContent=x.message;if(x.retry){nextAt=Date.now()+x.retry;LS.set('nextAt',nextAt)}else if(cool()){nextAt=0}tick()}
  }
  send.onclick=doSend;f.onkeydown=(k)=>{if(k.key==='Enter'&&!k.shiftKey&&!k.isComposing){k.preventDefault();doSend()}};
  tick();poll();
}

// ---------- VPN (личный кабинет pvpn.vitrinka.net, как в приложении для Android) ----------
// Запросы идут через воркер (/api/vpn/call): он подставляет cookie входа и отдаёт новый. Суммы сервер присылает в копейках.
const VPN_AUTH='/api/client/web';
class VpnAuth extends Error{}
class VpnFail extends Error{constructor(m,captcha){super(m);this.captcha=!!captcha}}
let vTok='',vExp=0,vBusy=false,vsid=0,vPollGen=0,vRefreshing=null,cfgP=null;
const vRef=()=>LS.get('vpn_refresh');
const vOk=(r)=>r.code>=200&&r.code<300;

async function vraw(m,p,b,o={}){
  const r=await fetch(API+'/api/vpn/call',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({device,m,p,b:b==null?null:String(b),bearer:o.bearer||'',refresh:o.refresh||'',ref:o.ref||'/app/plans'})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('Ошибка '+r.status));
  return j; // {code,text,refresh}
}
function vErr(r){
  const t=(r.text||'').trim();
  if(t[0]==='{'){try{const j=JSON.parse(t);for(const k of['detail','error','message']){const v=j[k];if(v!=null)return 'HTTP '+r.code+': '+String(typeof v==='string'?v:JSON.stringify(v)).slice(0,200)}}catch(e){}}
  return 'HTTP '+r.code;
}
function vLogout(){vTok='';vExp=0;LS.set('vpn_refresh','');LS.set('vpn_pay','')}
const vLoggedIn=()=>!!vRef()||(vTok&&Date.now()<vExp);
function vSave(j,refresh){
  const s=j.session||j,tok=s.access_token;
  if(!tok)throw new Error('Сервер не вернул токен');
  vTok=tok;vExp=Date.now()+(Number(s.expires_in)||3600)*1000;
  if(refresh)LS.set('vpn_refresh',refresh);
}
async function vDoRefresh(){
  const rc=vRef();if(!rc)throw new VpnAuth('Нужно войти заново');
  let last=0;
  // как сайт шлёт это продление (POST или GET) — из адресов не видно, пробуем по очереди
  for(const [m,b] of [['POST',null],['POST','{}'],['GET',null]]){
    const r=await vraw(m,VPN_AUTH+'/auth/refresh',b,{refresh:rc});
    if(vOk(r)){vSave(JSON.parse(r.text),r.refresh);return}
    last=r.code;
    if(r.code===401||r.code===403){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  throw new Error('Не удалось продлить сессию (код '+last+')');
}
async function vEnsure(){
  if(vTok&&Date.now()<vExp-60000)return vTok;
  if(!vRefreshing)vRefreshing=vDoRefresh().finally(()=>{vRefreshing=null});
  await vRefreshing;return vTok;
}
async function vAuthed(m,p,b){
  let r=await vraw(m,p,b,{bearer:await vEnsure()});
  if(r.code===401){
    vExp=0;r=await vraw(m,p,b,{bearer:await vEnsure()});
    if(r.code===401){vLogout();throw new VpnAuth('Сессия истекла, войдите заново')}
  }
  if(!vOk(r))throw new Error(vErr(r));
  return r.text;
}
const vj=(o)=>JSON.stringify(o);
const vget=async(p)=>JSON.parse(await vAuthed('GET',p));

// ---------- капча сайта (ALTCHA, подбор по PBKDF2) ----------
function vFail(r,path){
  if(r.code===429)return new VpnFail('Слишком много попыток. Подождите немного.');
  let code='',reason='',msg='';
  try{const j=JSON.parse((r.text||'').trim());code=j.code||'';reason=(j.context&&j.context.reason)||'';for(const k of['message','detail','error']){if(typeof j[k]==='string'&&j[k]){msg=j[k];break}}}catch(e){}
  if(code==='app.captcha'){
    return new VpnFail(reason==='captcha_replay'?'Проверка устарела. Попробуйте ещё раз.':reason==='captcha_missing'?'Проверка ещё не завершилась. Подождите секунду и повторите.':'Проверка не пройдена. Попробуйте ещё раз.',true);
  }
  if(r.code===404||r.code===405)return new VpnFail('Сервер не знает адрес '+path+' (HTTP '+r.code+')');
  return new VpnFail(msg?msg.slice(0,200)+' (HTTP '+r.code+')':'Ошибка сервера (HTTP '+r.code+')');
}
// объект по ключу «как есть»: подпись капчи считается по исходному порядку полей
function rawObject(text,key){
  const k=text.indexOf('"'+key+'"');if(k<0)throw new Error('Капча: в ответе нет поля '+key);
  const st=text.indexOf('{',k);if(st<0)throw new Error('Капча: не удалось разобрать ответ');
  let d=0,inS=false,esc2=false;
  for(let i=st;i<text.length;i++){
    const c=text[i];
    if(inS){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')inS=false}
    else if(c==='"')inS=true;else if(c==='{')d++;else if(c==='}'){d--;if(d===0)return text.slice(st,i+1)}
  }
  throw new Error('Капча: не удалось разобрать ответ');
}
const hexToBytes=(h)=>{if(h.length%2)throw new Error('Капча: неверное hex-значение');const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};
const bytesToHex=(b)=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function solveCaptcha(ref){
  const r=await vraw('GET','/api/captcha/challenge',null,{ref});
  if(!vOk(r))throw vFail(r,'/api/captcha/challenge');
  const j=JSON.parse(r.text);
  if('enabled' in j&&!j.enabled)return '';
  const p=j.parameters,sig=j.signature,rawParams=rawObject(r.text,'parameters');
  const hash={'PBKDF2/SHA-256':'SHA-256','PBKDF2/SHA-384':'SHA-384','PBKDF2/SHA-512':'SHA-512'}[p.algorithm||'PBKDF2/SHA-256'];
  if(!hash)throw new Error('Капча: неизвестный алгоритм '+p.algorithm);
  const cost=p.cost,keyLen=p.keyLength||32,prefix=String(p.keyPrefix).toLowerCase();
  const nonce=hexToBytes(p.nonce),salt=hexToBytes(p.salt);
  const t0=Date.now(),deadline=t0+90000;let found=null,next=0;
  async function work(){
    while(!found&&Date.now()<deadline){
      const counter=next++,pwd=new Uint8Array(nonce.length+4);
      pwd.set(nonce);new DataView(pwd.buffer).setUint32(nonce.length,counter>>>0,false); // счётчик — 4 байта, старший первым
      const key=await crypto.subtle.importKey('raw',pwd,'PBKDF2',false,['deriveBits']);
      const hex=bytesToHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash,salt,iterations:cost},key,keyLen*8));
      if(hex.startsWith(prefix)&&!found)found={counter,hex};
    }
  }
  await Promise.all([work(),work(),work(),work()]);
  if(!found)throw new Error('Не удалось пройти проверку за 90 секунд');
  const sol=vj({counter:found.counter,derivedKey:found.hex,time:Date.now()-t0});
  const payload='{"challenge":{"parameters":'+rawParams+',"signature":'+vj(sig)+'},"solution":'+sol+'}';
  return btoa(unescape(encodeURIComponent(payload)));
}
async function authPost(path,body,ref,withCaptcha){
  if(withCaptcha){const cap=await solveCaptcha(ref);if(cap)body.captcha=cap}
  const r=await vraw('POST',path,vj(body),{ref});
  if(!vOk(r))throw vFail(r,path);
  return r;
}

const vRub=(minor)=>Math.floor((Number(minor)+99)/100)+' ₽';
function plural(n,a,b,c){const m100=n%100,m10=n%10;return n+' '+(m100>=11&&m100<=14?c:m10===1?a:(m10>=2&&m10<=4)?b:c)}
const vDays=(n)=>plural(n|0,'день','дня','дней');
const vDevs=(n)=>plural(n|0,'устройство','устройства','устройств');
function vDate(s){const d=String(s||'').slice(0,10).split('-');return d.length===3?d[2]+'.'+d[1]+'.'+d[0]:String(s||'')}
function vDateTime(s){s=String(s||'');if(s.length<16)return s;const d=s.slice(0,10).split('-');return d.length===3?d[2]+'.'+d[1]+' '+s.slice(11,16):s}
const vPlanName=(n)=>String(n||'').charAt(0).toUpperCase()+String(n||'').slice(1);
const vGb=(b)=>(Number(b)/1073741824).toFixed(1).replace('.',',')+' ГБ';
const vProv=(id)=>({platega:'СБП',aurapay:'СБП 2',antilopay:'СБП 3',cryptobot:'CryptoBot (через Telegram)',xrocket:'xRocket (через Telegram)',lzt:'LZT Market'}[id]||id);
function vPlanLabel(p){
  const tag=p.is_special?' · особый':p.is_popular?' · популярный':'';
  return vPlanName(p.name)+' · '+vDevs(p.devices)+' — '+vRub(p.total_price_display)+tag;
}
// статус платежа: 2 — готово, 3 — отменён/истёк, остальное — ждём
function statusKind(raw){
  const s=String(raw||'').toLowerCase().trim();
  if(!s)return 4;
  if(['completed','complete','done','delivered','success','succeeded','fulfilled','finished','sent'].includes(s))return 2;
  if(['cancel','fail','expire','refund','reject','error'].some(x=>s.includes(x)))return 3;
  if(['complet','success','fulfil','finish'].some(x=>s.includes(x)))return 2;
  if(['paid','process','progress','deliver','confirm','send','queue','work'].some(x=>s.includes(x)))return 1;
  if(['pend','wait','new','creat','unpaid','await'].some(x=>s.includes(x)))return 0;
  return 4;
}

// ---------- мелкие окна ----------
function toast(t){
  const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);
  setTimeout(()=>e.remove(),2600);
}
function sheetOpen(title,html){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="sh"><b>'+esc(title)+'</b>'+html+'</div>';
  o.onclick=(e)=>{if(e.target===o)o.remove()};
  document.body.appendChild(o);return o;
}
function listSheet(title,items,cb){
  const o=sheetOpen(title,items.map((t,i)=>'<button class="it" data-i="'+i+'">'+esc(t)+'</button>').join(''));
  o.querySelectorAll('.it').forEach(b=>b.onclick=()=>{o.remove();cb(Number(b.dataset.i))});
}
function confirmSheet(title,text,ok,cb,danger){
  const o=sheetOpen(title,'<div class="mute small" style="margin:8px 0 4px">'+esc(text)+'</div><button class="b'+(danger?' dg':'')+'" id="sk">'+esc(ok)+'</button><button class="b ghost" id="sc">Отмена</button>');
  $('#sc',o).onclick=()=>o.remove();$('#sk',o).onclick=()=>{o.remove();cb()};
}
function inputSheet(title,hint,prefill,cb){
  const o=sheetOpen(title,'<input id="si" inputmode="numeric" style="margin-top:10px" placeholder="'+esc(hint)+'" value="'+esc(prefill||'')+'"><button class="b" id="sk">Готово</button><button class="b ghost" id="sc">Отмена</button>');
  $('#sc',o).onclick=()=>o.remove();
  $('#sk',o).onclick=()=>{if(cb($('#si',o).value.trim())!==false)o.remove()};
  setTimeout(()=>$('#si',o).focus(),50);
}

}

function vLoginView(box,alive){
  box.innerHTML='<div class="vhero">'+vShield('')+'<span class="vorb o1">'+ic('lock',16)+'</span><span class="vorb o2">'+ic('bolt',16)+'</span><span class="vorb o3">'+ic('globe',16)+'</span><h3>Защита в одно касание</h3><div class="mute small">Войдите, чтобы купить подписку или управлять своей</div></div>'
  +'<button class="vbtn tg" id="tg">'+ic('send',20)+'<span>Войти через Telegram</span></button><div class="vinfo" id="tgi" hidden></div>'
  +'<div class="vor"><span>или по почте</span></div><div class="vcard" id="em"></div>';
  const info=$('#tgi'),tg=$('#tg');
  const say=(h,spin)=>{info.hidden=false;info.innerHTML=(spin?'<span class="vspn"></span>':'')+'<div style="flex:1">'+h+'</div>'};
  function pollLogin(id,until){
    if(!alive())return;
    if(Date.now()>until){tg.classList.remove('ld');say('Время ожидания вышло. Нажмите кнопку ещё раз.');return}
    VP.pollLogin(id).catch(()=>'error').then((res)=>{
      if(!alive())return;
      if(res==='confirmed')return vpnScreen();
      if(res==='pending'||res==='error')setTimeout(()=>pollLogin(id,until),2000);
      else{tg.classList.remove('ld');say('Вход не подтверждён ('+esc(res)+'). Нажмите кнопку ещё раз.')}
    });
  }
  tg.onclick=async()=>{
    if(vBusy)return;vBusy=true;tg.classList.add('ld');
    const w=window.open('about:blank','_blank'); // открываем сразу, пока жив тап: иначе браузер заблокирует окно
    say('Создаём вход…',1);
    try{
      const r=await VP.startLogin(),url=String(r.bot_url||''),num=Number(r.number)||0;
      const until=Date.now()+(Number(r.expires_in)||300)*1000;
      if(!/^https:\/\//.test(url))throw new Error('Сайт не вернул ссылку на бота');
      say('Нажмите Start в Telegram и вернитесь сюда'+(num?' · номер входа <b>'+num+'</b>':'')+'<br><a href="'+esc(url)+'" target="_blank" rel="noopener">Открыть бота ещё раз</a>',1);
      if(w)w.location.href=url;
      pollLogin(String(r.poll_id),until);
    }catch(x){if(w)w.close();tg.classList.remove('ld');say('Ошибка: '+esc(x.message))}
    finally{vBusy=false}
  };
  vEmailAuth($('#em'),alive);
}
function vEmailAuth(card,alive){
  let working=false,savedEmail='',prevP=0;
  const okMail=(s)=>/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(s);
  const tabs=(m)=>'<div class="vseg" style="--p:'+prevP+'"><i></i><button data-m="login" class="'+(m==='login'?'on':'')+'">'+ic('lock',16)+'Войти</button><button data-m="reg" class="'+(m==='reg'?'on':'')+'">'+ic('user',16)+'Регистрация</button></div>';
  const head=(t,s)=>'<div class="vh"><b>'+t+'</b>'+(s?'<div class="mute small">'+s+'</div>':'')+'</div>';
  const fld=(icn,id,type,ph,ac,val,eye)=>'<div class="vin">'+ic(icn,18)+'<input id="'+id+'" '+(type==='code'?'type="text" inputmode="numeric"':'type="'+type+'"')+' autocomplete="'+ac+'" placeholder="'+ph+'" value="'+esc(val||'')+'">'+(eye?'<button type="button" class="eye" data-eye aria-label="Показать пароль">'+ic('eye',18)+'</button>':'')+'</div>';
  const btn=(t,icn)=>'<button class="vbtn" id="go">'+ic(icn,19)+'<span>'+t+'</span></button><div class="vmsg" id="i"></div>';
  const link=(id,t)=>'<div class="vlk" id="'+id+'">'+t+'</div>';
  function bind(mode){
    card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(!working)render(b.dataset.m)});
    card.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,sh=i.type==='password';i.type=sh?'text':'password';b.innerHTML=ic(sh?'eyeoff':'eye',18)});
    const sg=card.querySelector('.vseg');
    if(sg&&mode){const p=mode==='reg'?1:0;requestAnimationFrame(()=>requestAnimationFrame(()=>sg.style.setProperty('--p',p)));prevP=p}
  }
  function task(info,wait,work,ok){
    if(working)return;working=true;const gb=card.querySelector('#go');gb&&gb.classList.add('ld');info.className='vmsg';info.textContent=wait;
    const done=()=>{working=false;gb&&gb.classList.remove('ld')};
    work().then(()=>{done();if(alive())ok()}).catch((e)=>{done();if(alive()){info.className='vmsg bad';info.textContent=(e&&e.message)||'Не удалось выполнить запрос'}});
  }
  const fail=(info,m)=>{info.className='vmsg bad';info.textContent=m};
  const sent=(info)=>{info.className='vmsg ok';info.textContent='Код отправлен ещё раз'};
  const WAIT='Проверка и отправка кода… это займёт несколько секунд';
  function render(mode,step){
    if(mode==='login'){
      card.innerHTML=tabs('login')+fld('mail','e','email','Почта','email',savedEmail)+fld('lock','p','password','Пароль','current-password','',1)+btn('Войти','bolt')+link('fg','Забыли пароль?');
      bind('login');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(!p)return fail(info,'Введите пароль');
        task(info,'Входим…',()=>VP.loginEmail(e,p),()=>vpnScreen());
      };
      $('#fg',card).onclick=()=>{if(working)return;savedEmail=$('#e',card).value.trim();render('reset')};
    }else if(mode==='reg'&&!step){
      card.innerHTML=tabs('reg')+fld('mail','e','email','Почта','email',savedEmail)+fld('lock','p','password','Придумайте пароль','new-password','',1)+btn('Получить код','send')+'<div class="mute small" style="text-align:center;margin-top:8px">Пришлём код подтверждения на почту</div>';
      bind('reg');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim(),p=$('#p',card).value;savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        task(info,WAIT,()=>VP.registerRequest(e,p),()=>render('reg',{pwd:p}));
      };
    }else if(mode==='reg'){
      const pwd=step.pwd;
      card.innerHTML=tabs('reg')+head('Код из письма','Отправили на '+esc(savedEmail))+fld('key','c','code','Код из письма','one-time-code')+btn('Подтвердить','check')+link('rs','Отправить код ещё раз')+link('ch','Изменить почту или пароль');
      bind('reg');const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim();if(!c)return fail(info,'Введите код из письма');
        task(info,'Подтверждаем…',()=>VP.registerConfirm(savedEmail,c,pwd),()=>vpnScreen());
      };
      $('#rs',card).onclick=()=>task(info,WAIT,()=>VP.registerRequest(savedEmail,pwd),()=>sent(info));
      $('#ch',card).onclick=()=>{if(!working)render('reg')};
    }else if(mode==='reset'&&!step){
      card.innerHTML=head('Сброс пароля','Пришлём код на почту — по нему можно задать новый пароль')+fld('mail','e','email','Почта','email',savedEmail)+btn('Получить код','send')+link('bk','← Назад ко входу');
      const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const e=$('#e',card).value.trim();savedEmail=e;
        if(!okMail(e))return fail(info,'Проверьте адрес почты');
        task(info,WAIT,()=>VP.resetRequest(e),()=>render('reset',{sent:1}));
      };
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }else{
      card.innerHTML=head('Новый пароль','Код отправлен на '+esc(savedEmail))+fld('key','c','code','Код из письма','one-time-code')+fld('lock','p','password','Новый пароль','new-password','',1)+btn('Сменить пароль','check')+link('rs','Отправить код ещё раз')+link('bk','← Назад ко входу');
      bind();const info=$('#i',card);
      $('#go',card).onclick=()=>{
        const c=$('#c',card).value.trim(),p=$('#p',card).value;
        if(!c)return fail(info,'Введите код из письма');
        if(p.length<6)return fail(info,'Пароль слишком короткий');
        let signed=false;
        task(info,'Меняем пароль…',async()=>{signed=await VP.resetConfirm(savedEmail,c,p)},()=>{
          if(signed)vpnScreen();else{toast('Пароль изменён — войдите с новым');render('login')}
        });
      };
      $('#rs',card).onclick=()=>task(info,'Проверка и отправка кода…',()=>VP.resetRequest(savedEmail),()=>sent(info));
      $('#bk',card).onclick=()=>{if(!working)render('login')};
    }
  }
  render('login');
}

// ---------- подписки и покупка ----------
let vTabSel=-1;
function vForm(box,alive,subs,plansAll,prov){
  const methods=(prov.providers||[]).filter(Boolean).map(id=>[id,vProv(id)]);
  const list=plansAll.filter(p=>!p.is_lifetime).sort((a,b)=>(a.days-b.days)||(a.total_price_display-b.total_price_display)); // бессрочные не берём

  box.innerHTML='<div class="vhero vs '+hs+'">'+vShield(hs,best?'shield':frz?'snow':'shieldoff')+'<h3>'+(best?'Защита включена':frz?'Подписка заморожена':'Нет активной подписки')+'</h3><div class="mute small">'+(best?'Осталось '+vDays(best.days_left)+' · до '+vDate(best.end_date):frz?'Разморозьте её, чтобы снова пользоваться VPN':'Выберите тариф — ключ появится здесь сразу после оплаты')+'</div></div><div id="pb"></div><div class="vseg" id="sg" style="--p:'+S.tab+'"><i></i><button data-tab="0">'+ic('shield',17)+'Моя подписка</button><button data-tab="1">'+ic('bag',17)+'Купить</button></div><div id="vc"></div>';
  const vc=$('#vc',box);

  // платёж создан, но ещё не подтверждён
  function paintPending(){
    const id=LS.get('vpn_pay'),pb=$('#pb',box);
    if(!id){pb.innerHTML='';return}
    pb.innerHTML='<div class="vpend"><span class="vspn"></span><div style="flex:1"><b>Ждём оплату</b><div class="small mute" id="pw">Подтверждение придёт автоматически</div></div></div><div class="vrow2"><button class="vbtn alt" id="pn">'+ic('renew',18)+'<span>Проверить</span></button><button class="vbtn gh" id="px"><span>Не жду</span></button></div>';
    $('#pn',box).onclick=()=>{$('#pw',box).textContent='Проверяем оплату…';pollPay(id,0,++vPollGen)};
    $('#px',box).onclick=()=>{LS.set('vpn_pay','');vPollGen++;paintPending()};
  }
  function pollPay(id,tries,gp){
    if(!alive()||gp!==vPollGen)return;
    VP.paymentStatus(id).then((j)=>{
      const st=j.status;
      return (j.fulfillment==='done'||statusKind(st)===2)?'done':statusKind(st)===3?'failed':'wait';
    }).catch((e)=>e instanceof VpnAuth?'auth':'wait').then((res)=>{
      if(!alive()||gp!==vPollGen)return;
      const pw=$('#pw',box);
      if(res==='done'){const pk=LS.get('vpn_pk');if(pk)LS.set('ach_'+pk,'1');LS.set('vpn_pk','');LS.set('vpn_pay','');toast('Оплата прошла — подписка готова');vpnScreen()}
      else if(res==='failed'){LS.set('vpn_pay','');toast('Платёж отменён или истёк');vpnScreen()}
      else if(res==='auth')vpnScreen();
      else if(tries>=60){if(pw)pw.textContent='Оплата пока не подтвердилась. Нажмите «Проверить сейчас» после оплаты.'}
      else{if(pw)pw.textContent='Ждём подтверждение оплаты…';setTimeout(()=>pollPay(id,tries+1,gp),4000)}
    });

  // вернулись во вкладку после оплаты — проверяем сразу
  const onVis=()=>{if(document.visibilityState==='visible'&&alive()&&LS.get('vpn_pay'))pollPay(LS.get('vpn_pay'),0,++vPollGen);else if(!alive())document.removeEventListener('visibilitychange',onVis)};
  document.addEventListener('visibilitychange',onVis);

  // создаёт платёж (покупка, продление, трафик, пополнение) и открывает страницу оплаты
  async function payWith(note,create,kind){
    if(vBusy)return;if(LS.get('cpay')&&!confirm('Перейти к оплате?'))return;vBusy=true;
    const w=window.open('about:blank','_blank'); // пока жив тап, иначе окно оплаты заблокируют

    try{
      const r=await create(),id=r.payment_id||'',url=String(r.invoice_url||'');
      if(id){LS.set('vpn_pay',id);LS.set('vpn_pk',kind||'')}
      if(!/^https:\/\//.test(url)){if(w)w.close();note.textContent='Сайт не вернул ссылку на оплату';return}

      if(w)w.location.href=url;
      if(id){paintPending();pollPay(id,0,++vPollGen)}
    }catch(x){
      if(w)w.close();
      if(x instanceof VpnAuth)return vpnScreen();
      note.textContent='Ошибка: '+x.message;
    }finally{vBusy=false}
  }
  const guard=(fn)=>async(...a)=>{try{await fn(...a)}catch(x){if(x instanceof VpnAuth)vpnScreen();else toast('Ошибка: '+x.message)}};

  // ---------- вкладка «Моя подписка» ----------

  function subCard(s,i){

    const dl=Math.max(0,Number(s.days_left)||0),tot=Number(s.days)||Math.max(dl,30),pc=Math.min(1,dl/tot);

    if(lim>0){const p2=Math.min(100,Math.round(used/lim*100));h+='<div class="vtr"><div class="vtrh"><span>'+ic('chart',15)+'Трафик</span><b>'+vGb(used)+' из '+vGb(lim)+'</b></div><div class="vbar'+(p2>=90?' hi':'')+'"><i data-w="'+p2+'"></i></div></div>'}

const BG={1:{c:'🍂',vy:.7,vx:.4,s:[14,22]},2:{cols:['#fff','#dfe9ff'],vy:.55,vx:.25,s:[2,5]},3:{cols:['#FFC233','#FFE08A'],vy:-.25,vx:.2,s:[2,4],tw:1},4:{c:'🌸',vy:.55,vx:.45,s:[12,18]},5:{cols:['#8B7CFF','#fff','#9aa0ff'],vy:.06,vx:.1,s:[1.5,4],tw:1},6:{cols:['#D4FF00','#fff'],vy:-.4,vx:.05,s:[2,4]},7:{cols:['#9ec5ff','#ffffff','#c4b5fd'],vy:-.25,vx:.08,s:[3,9]},8:{cols:['#5EEAD4','#ffffff','#A7F3D0'],vy:.03,vx:.06,s:[1.5,3.5],tw:1},9:{cols:['#FFB38A','#FF7A59','#FFD6A5'],vy:-.35,vx:.1,s:[2,5],tw:1}};
const cv=document.createElement('canvas');cv.id='bgc';document.body.prepend(cv);
const cx=cv.getContext('2d');let P=[],raf=0,W=0,H=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function bgSize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function mk(c,init){return{x:rnd(0,W),y:init?rnd(0,H):(c.vy>=0?-24:H+24),s:rnd(c.s[0],c.s[1]),vx:rnd(-1,1)*c.vx+c.vx*.3,vy:c.vy*rnd(.6,1.4),r:rnd(0,6.28),vr:rnd(-.02,.02),a:rnd(.35,.9),ph:rnd(0,6.28),col:c.cols?c.cols[Math.floor(Math.random()*c.cols.length)]:''}}
function bgInit(){
  cancelAnimationFrame(raf);bgSize();cx.clearRect(0,0,W,H);
  const c=BG[TH('skin',0)];if(!c||!TH('anim',ANIM_D))return;
  P=Array.from({length:Math.round(36*[.5,1,1.7][TH('pc',1)])},()=>mk(c,true));loop();

  +sec('Иконка приложения')+`<div class="card"><div class="mute small" style="margin-bottom:10px">Выберите кота для значка на рабочем столе</div><div class="cats">${CATS.map(([i,n])=>`<button class="cat${ic===i?' on':''}" data-ic="${i}">${catSvg(i)}<span>${n}${ic===i?' ✓':''}</span></button>`).join('')}</div><div class="mute small" style="margin-top:10px">Значок берётся при установке PWA, так что выбирайте кота до установки. Если приложение уже на рабочем столе и значок не поменялся, удалите его и установите заново.</div></div>`
  +sec('Анимации и отклик')+`<div class="card">${tgl('anim','Анимированный фон','Снег, листья, звёзды и другие эффекты выбранной темы',{d:ANIM_D})}<div class="mute small" style="margin:4px 0 6px">Сколько частиц на фоне</div>${seg('pc',[[0,'Меньше'],[1,'Обычно'],[2,'Больше']],1)}${tgl('tr','Плавные переходы','Экраны и карточки появляются с анимацией',{d:1})}${tgl('hap','Вибрация при нажатии','Лёгкий отклик на касание кнопок и карточек (не работает на iPhone)',{f:1})}</div>`
  +sec('Заказы')+`<div class="card"><div class="mute small" style="margin-bottom:6px">Как показывать шаги заказа</div>${seg('os',[[0,'Значок'],[1,'Полоса']],1)}<div class="mute small">Так будет выглядеть заказ, который оплачен и выдаётся:</div>${ordPrev()}</div>`;
}
function sbSec(){
  const m=lockMode(),dis=!m,hint='Сначала включите вход по PIN или отпечатку';
  return sec('Вход в приложение')+`<div class="card"><b>PIN-код и отпечаток</b><div class="mute small">Защитите чат, поддержку и VPN от посторонних</div><div class="seg" style="margin:10px 0 0">${[['','Выкл'],['pin','PIN'],['bio','Отпечаток']].map(([v,t])=>`<button data-lk="${v}" class="${m===v?'on':''}">${t}</button>`).join('')}</div></div>`
  +sec('Защита данных')+`<div class="card">${tgl('rec','Скрывать экран в «Недавних»','Закрывает содержимое, когда приложение уходит в фон. Скриншоты браузер заблокировать не позволяет')}${tgl('pm','Скрывать суммы и ники','В профиле вместо них точки, пока не нажмёте на карточку')}${tgl('cpay','Подтверждать оплату','Окно перед переходом к оплате',{f:1})}${tgl('vmask','Прятать ссылку подписки VPN','Ссылка показывается только после нажатия на неё',{f:1})}${tgl('clip','Очищать буфер обмена','Через минуту после копирования ссылки подписки',{f:1})}${tgl('pinvpn','PIN для выхода из VPN',dis?hint:'Спросим PIN или отпечаток перед выходом из аккаунта VPN',{f:1,dis})}${tgl('sf','Показывать неудачные попытки входа',dis?hint:'После разблокировки покажем, кто пытался войти',{dis})}</div>`;
}
function sbMisc(){
  const perm=typeof Notification==='undefined'?'не поддерживаются':({granted:'разрешены',denied:'запрещены',default:'не запрошены'}[Notification.permission]);
  return sec('Уведомления')+`<div class="card">${tgl('np','Push-уведомления','Ответы поддержки и личные сообщения, пока приложение открыто или свёрнуто')}${tgl('nv','VPN: подписка заканчивается','За 3 дня и за 1 день до конца. Нужны уведомления и вход в VPN',{d:1})}${tgl('nt','VPN: трафик заканчивается','Когда использовано 90% и когда трафик закончился',{d:1})}${tgl('nr','Напоминания о покупке','Редкие напоминания про VPN, не ночью',{d:1})}<button class="gb" data-a="nsys" style="margin-top:6px">Системные настройки уведомлений</button></div>`
  +`<div class="mute small" style="margin:-4px 2px 0">Push при закрытом приложении в PWA недоступен: уведомления приходят, пока оно открыто или в фоне.</div>`
  +sec('Обновления')+`<div class="card">${tgl('au','Обновлять автоматически','Когда вы возвращаетесь в приложение, новая версия ставится сама')}<button class="gb" data-a="upd">Проверить обновления</button></div>`
  +sec('Помощь')+`<div class="card"><div class="mute small">Что-то работает не так? Отправьте отчёт: версия, устройство и последние ошибки уйдут в поддержку.</div><div class="g2"><button class="gb pr" data-a="rep">Сообщить об ошибке</button><button class="gb" data-a="new">Что нового</button></div></div>`
  +sec('Сброс')+`<div class="card"><div class="mute small">Вернёт тему, размер текста и переключатели оформления и безопасности к исходным. PIN, чаты, вход в VPN, уведомления и обновления не затрагиваются.</div><button class="gb" data-a="rst" style="margin-top:10px;color:var(--red);border-color:var(--red)">Сбросить настройки</button></div>`
  +sec('Данные приложения')+`<div class="card"><div class="mute small">Что приложение собирает, когда это уходит администратору и что не собирается никогда.</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="gb" data-a="dat">Какие данные собирает приложение</button><button class="gb" data-a="cht">Приватность чатов</button></div></div>`
  +`<div class="mute small" style="text-align:center;margin:20px 0 8px">Уведомления в браузере: ${perm}<br>Приложение в активной разработке<br>Версия PWA ${VER} (сборка ${BUILD})</div><div style="text-align:center;padding-bottom:10px"><button class="chip" data-a="upd" style="margin:0">Проверить обновления</button></div>`;
}
function sbRender(){
  const sb=$('#sb');if(!sb)return;const top=sb.scrollTop;
  sb.innerHTML=[sbLook,sbSec,sbMisc][sTab]();sb.scrollTop=top;
  document.querySelectorAll('#stb button').forEach(b=>b.classList.toggle('on',Number(b.dataset.i)===sTab));
}
function reportSheet(){
  const txt=('Отчёт об ошибке (PWA '+VER+', сборка '+BUILD+')\nУстройство: '+navigator.userAgent.slice(0,150)+'\nЭкран: '+innerWidth+'×'+innerHeight+'\nПоследние ошибки:\n'+(ERRS.length?ERRS.join('\n'):'нет')).slice(0,900);
  const o=sheetOpen('Сообщить об ошибке','<div class="mute small" style="margin:8px 0">В поддержку уйдёт:</div><div class="card small" style="white-space:pre-wrap;word-break:break-word">'+esc(txt)+'</div><button class="b" id="sk">Отправить</button><button class="b ghost" id="sc">Отмена</button>');
  $('#sc',o).onclick=()=>o.remove();
  $('#sk',o).onclick=async()=>{try{await api('/api/chat/send',{nick:LS.get('nick'),order:'',version:'pwa '+VER,text:txt,info:navigator.userAgent.slice(0,200)});o.remove();toast('Отчёт отправлен')}catch(x){toast(x.message)}};
}
const info=(t,s)=>sheetOpen(t,'<div class="mute small" style="margin:8px 0">'+s+'</div>');
async function sbClick(e){
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.k!==undefined){LS.set(d.r?d.k:'th_'+d.k,d.v);applyTheme();applyUI();sbRender()}
  else if(d.tg){
    const k=d.tg;
    if(d.f)LS.set(k,LS.get(k)?'':'1');
    else{
      const nv=TH(k,Number(d.d))?0:1;
      if(k==='np'&&nv){
        if(typeof Notification==='undefined'){toast('Браузер не поддерживает уведомления');return}
        if(await Notification.requestPermission()!=='granted'){toast('Разрешите уведомления в настройках браузера');return}
      }
      LS.set('th_'+k,nv);
    }
    applyUI();sbRender();
  }
  else if(d.ic!==undefined){LS.set('icon',d.ic);applyIcon();sbRender()}
  else if(d.hs){const h=HID(),i=h.indexOf(d.hs);if(i>=0)h.splice(i,1);else h.push(d.hs);LS.set('hidt',h.join(','));applyUI();sbRender()}
  else if(d.lk!==undefined)setLock(d.lk);
  else if(d.a==='rep')reportSheet();
  else if(d.a==='new')whatsNew();
  else if(d.a==='upd')checkUpd(true);
  else if(d.a==='nsys')info('Системные настройки уведомлений','Откройте настройки браузера или установленного приложения (Настройки телефона → Приложения → PharmShop → Уведомления) и разрешите уведомления для этого сайта.');
  else if(d.a==='dat')info('Какие данные собирает приложение','На сервер уходят только ник и сообщения чатов, обращения в поддержку (с названием браузера и отчётами об ошибках, если вы их отправили) и запросы VPN-кабинета через сервер. Контакты, геолокация и список приложений не собираются никогда. Тема, PIN (в виде хэша) и остальные настройки хранятся только в этом браузере.');
  else if(d.a==='cht')info('Приватность чатов','Сообщения общего чата видят все его участники. Личные переписки предназначены вам и собеседнику. Обращения в поддержку читает администратор. Не отправляйте в чаты пароли, ключи и ссылки подписки.');
  else if(d.a==='rst')confirmSheet('Сбросить настройки?','Тема, размер текста и переключатели вернутся к исходным. PIN, чаты, вход в VPN, уведомления и обновления не затрагиваются.','Сбросить',()=>{
    Object.keys(localStorage).filter(k=>k.startsWith('th_')&&!/^th_(np|nv|nt|au)$/.test(k)).forEach(k=>localStorage.removeItem(k));
    ['vmask','clip','cpay','hap','pinvpn','hidt','stt'].forEach(k=>LS.set(k,''));applyTheme();applyUI();sbRender();toast('Настройки сброшены');
  },true);
}
function setTab(){
  window.RC=0;
  view.innerHTML='<div class="pf-top"><h2>Настройки</h2><button class="chip" data-s="sup" style="margin:0">💬 Поддержка</button></div><div class="seg" id="stb" style="flex:none">'+['Оформление','Безопасность','Прочее'].map((t,i)=>`<button data-i="${i}">${t}</button>`).join('')+'</div><div class="vp" id="sb"></div>';
  $('#stb').onclick=(e)=>{const b=e.target.closest('button');if(!b)return;sTab=Number(b.dataset.i);sbRender();$('#sb').scrollTop=0};
  $('.pf-top .chip').onclick=()=>go('help');
  $('#sb').onclick=sbClick;sbRender();
}

function burst(x,y){
  if(!TH('tr',1))return;const E=['✨','🎉','💜','⭐','🔥','💙'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='bst';s.textContent=E[i%E.length];const a=Math.random()*6.28,r=60+Math.random()*80;
    s.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*r+'px;--dy:'+(Math.sin(a)*r-40)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)}
}
